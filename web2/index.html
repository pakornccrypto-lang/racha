function hasLocalData(){return ORDER.some(t=>recs(t,true).length)}
async function cloudConnect(){const url=$('#clUrl').value.trim(),key=$('#clKey').value.trim(),schema=$('#clSchema').value.trim()||'fsms',sid=$('#clState').value.trim()||'main';
  const email=$('#clEmail').value.trim(),pw=$('#clPw').value;if(!email||!pw)return toast('กรอกอีเมลและรหัสผ่าน Supabase','bad');
  const changed=url!==CL.url||schema!==CL.schema||sid!==CL.stateId;Object.assign(CL,{url,key,schema,stateId:sid});if(changed){CL.baseVersion=null;CL.baseAuditLen=0;CL.dirty={};CL.dirtyMeta=false}
  try{await clLogin(email,pw);if(!await clIsMember())throw new Error('บัญชีนี้ยังไม่อยู่ในตาราง fsms.members — ให้ผู้ดูแลเพิ่ม user_id ของบัญชีนี้ก่อน');
    const head=await clHead();const wasOn=CL.on;CL.on=true;saveCloudCfg();
    if(!head){if(!confirm('Cloud ยังไม่มีข้อมูล — อัปโหลดข้อมูลในเครื่องนี้เป็นข้อมูลตั้งต้นหรือไม่?')){CL.on=wasOn;saveCloudCfg();return}
      await cloudSync({allowInit:true,throwErr:true});closeModal();toast('อัปโหลดข้อมูลตั้งต้นขึ้น Cloud แล้ว','ok');return}
    if(CL.baseVersion==null&&hasLocalData()){closeModal();modal('Cloud มีข้อมูลอยู่แล้ว',`<p>ใน workspace <b data-notr>${esc(sid)}</b> มีข้อมูลเวอร์ชัน ${head.version} (แก้ล่าสุดโดย <span data-notr>${esc(head.updated_by||'')}</span>) และเครื่องนี้ก็มีข้อมูลอยู่</p>
       <p><b>ใช้ข้อมูลจาก Cloud</b> = ข้อมูลในเครื่องนี้ถูกแทนที่ (แนะนำ ถ้าเครื่องนี้เป็นเครื่องใหม่หรือข้อมูลตัวอย่าง)<br><b>รวมข้อมูล</b> = ส่งทุกบันทึกในเครื่องนี้ขึ้นไปรวมกับ Cloud</p>`,
       `<button class="btn" onclick="cloudMergeAll()">รวมข้อมูล</button><button class="btn p" onclick="cloudUseRemote()">ใช้ข้อมูลจาก Cloud</button>`,'narrow');return}
    await cloudSync({throwErr:true});closeModal();toast('เชื่อมต่อ Cloud แล้ว','ok')}
  catch(e){toast(e.message,'bad');setCl('err',e.message)}}
async function cloudUseRemote(){CL.baseVersion=null;CL.dirty={};CL.dirtyMeta=false;CL.baseAuditLen=0;saveCloudCfg();
  try{const row=await clGet();closeModal();applyRemote(await decryptText(row.data),row);if(ME)toast('ใช้ข้อมูลจาก Cloud แล้ว — ถ้าผู้ใช้ของคุณไม่มีใน Cloud ให้เข้าสู่ระบบใหม่','ok')}catch(e){toast(e.message,'bad')}}
async function cloudMergeAll(){ORDER.forEach(t=>recs(t,true).forEach(r=>{CL.dirty[t+':'+r._id]=++CLGEN}));CL.baseVersion=-1;saveCloudCfg();closeModal();
  try{await cloudSync({mergeAll:true,throwErr:true});toast('รวมข้อมูลขึ้น Cloud แล้ว','ok')}catch(e){toast(e.message,'bad')}}
function cloudDisconnect(){if(clPending()&&!confirm('ยังมีข้อมูลที่ยังไม่ได้ส่งขึ้น Cloud — ตัดการเชื่อมต่อหรือไม่? (ข้อมูลยังอยู่ในเครื่องนี้)'))return;
  CL.on=false;CL.sess=null;saveCloudCfg();setCl('off');closeModal();if(ME)render();else showLogin();toast('ตัดการเชื่อมต่อ Cloud แล้ว')}

  else cloudUseRemote()}

const CLOUD_SQL=`-- FSMS 香水椰 — Supabase setup (v1.3.0). Safe to run in a project that already holds other apps:
-- everything lives in schema "fsms"; nothing in "public" is touched.
create schema if not exists fsms;

-- 1) who may use FSMS (Supabase Auth users); other apps' users are NOT allowed unless listed here
create table if not exists fsms.members (
  user_id uuid primary key references auth.users(id) on delete cascade,
  note text,
  created_at timestamptz not null default now()
);

-- 2) the app data: one encrypted blob per workspace, optimistic version lock
create table if not exists fsms.app_state (
  id text primary key,
  data text not null,
  version bigint not null default 1,
  app_ver text,
  updated_at timestamptz not null default now(),
  updated_by text
);

-- 3) automatic backups: keeps a copy of the previous version at most every 30 minutes
create table if not exists fsms.snapshots (
  id bigserial primary key,
  state_id text not null,
  version bigint not null,
  data text not null,
  app_ver text,
  created_at timestamptz not null default now()
);
create index if not exists snapshots_state_idx on fsms.snapshots(state_id, created_at desc);

create or replace function fsms.is_member() returns boolean
language sql stable security definer set search_path = fsms, public as $$
  select exists (select 1 from fsms.members where user_id = auth.uid());
$$;

create or replace function fsms.keep_snapshot() returns trigger
language plpgsql security definer set search_path = fsms, public as $$
begin
  if not exists (select 1 from fsms.snapshots s where s.state_id = old.id and s.created_at > now() - interval '30 minutes') then
    insert into fsms.snapshots(state_id, version, data, app_ver) values (old.id, old.version, old.data, old.app_ver);
  end if;
  new.updated_at := now();
  return new;
end $$;
drop trigger if exists trg_keep_snapshot on fsms.app_state;
create trigger trg_keep_snapshot before update on fsms.app_state
  for each row execute function fsms.keep_snapshot();

-- 4) row level security: only members, no delete from the app
alter table fsms.members   enable row level security;
alter table fsms.app_state enable row level security;
alter table fsms.snapshots enable row level security;

drop policy if exists members_self on fsms.members;
create policy members_self on fsms.members for select to authenticated using (user_id = auth.uid());

drop policy if exists state_select on fsms.app_state;
drop policy if exists state_insert on fsms.app_state;
drop policy if exists state_update on fsms.app_state;
create policy state_select on fsms.app_state for select to authenticated using (fsms.is_member());
create policy state_insert on fsms.app_state for insert to authenticated with check (fsms.is_member());
create policy state_update on fsms.app_state for update to authenticated using (fsms.is_member()) with check (fsms.is_member());

drop policy if exists snap_select on fsms.snapshots;
create policy snap_select on fsms.snapshots for select to authenticated using (fsms.is_member());

-- 5) privileges (anon gets nothing)
revoke all on schema fsms from anon;
grant usage on schema fsms to authenticated;
grant select on fsms.members to authenticated;
grant select, insert, update on fsms.app_state to authenticated;
grant select on fsms.snapshots to authenticated;
grant execute on function fsms.is_member() to authenticated;

-- 6) AFTER creating the factory login in Authentication → Users, add it as a member
--    (replace the e-mail):
-- insert into fsms.members(user_id, note)
--   select id, 'FSMS factory login' from auth.users where email = 'fsms@your-company.com'
--   on conflict do nothing;

-- 7) In Project Settings → API (Data API) → Exposed schemas, add: fsms
`;

 story:{th:'ถังต้องผ่าน CIP หลังใช้ครั้งก่อนจึงเติมได้ ค่าเริ่มต้นคือ 1 ถัง = 1 batch (禁止不同批次混罐) ถังต้องอยู่ที่ 4–10°C และพักได้ไม่เกินเวลาที่ตั้งไว้ ระบบเตือนเมื่อขาดบันทึกอุณหภูมิ',

 flow:['cip','tankfill','tanktemp'],
 steps:{th:['CIP: เลือกถัง ติ๊กขั้นตอน ใส่ความเข้มข้น/อุณหภูมิ/เวลาของขั้นที่เลือก (ด่าง กรด สารฆ่าเชื้อ)','เติมถัง: เลือกถัง + batch + ลิตร ติ๊กใบกวน ใส่ Brix บน/ล่าง','อุณหภูมิถัง: บันทึกตามรอบ เกิน 10°C = แดง + NC กักถังอัตโนมัติ','ดูหน้าแรก "ถังพักที่มีน้ำอยู่" เพื่อดูชั่วโมงและอุณหภูมิล่าสุด'],

 story:{th:'ทุกค่าที่ผิดเกณฑ์จะเป็นสีแดงและต้องกรอกการแก้ไขทันที ถ้าเกี่ยวกับตัวสินค้า ระบบสร้าง NC และกัก lot/batch/ถังทันที (เลือกใช้ไม่ได้ ปล่อยไม่ได้) จนกว่า QA จะตัดสิน ถ้าไม่เกี่ยวกับสินค้า ระบบสร้าง CAPA ส่วนข้อร้องเรียนและตรวจ GMP ไม่ผ่านก็สร้าง CAPA ให้เช่นกัน',
  zh:'任何超标数值都会变红并须填写立即纠正。与产品相关时，系统立即创建 NC 并隔离批次/生产批次/储罐（不能选用、不能放行），直到 QA 作出处置；与产品无关时自动创建 CAPA。客诉和 GMP 检查不合格也会自动创建 CAPA。'},

 steps:{th:['เปิดเมนู NC → เลือกการจัดการ: ทำลาย / คืนผู้ส่ง / ลดเกรด / ยอมรับพิเศษ (เฉพาะ QA/Director)','"ลดเกรด" ทำให้ lot กลายเป็นมะพร้าวทั่วไป ห้ามเข้าถังน้ำหอม','CAPA: สาเหตุราก (5-Whys) → การแก้ไข → ผู้รับผิดชอบ → กำหนดเสร็จ → ทวนสอบ → อนุมัติปิด','ติ๊ก "ข้อบกพร่องจากการตรวจครั้งก่อน" เพื่อเข้ารายงาน CAPA การตรวจครั้งก่อน'],

{id:'s11',title:{th:'ลายเซ็น แก้ไข ยกเลิก และ Audit trail',zh:'签名、修改、作废与审计追踪'},

 story:{th:'ลายเซ็นมี 3 ระดับ (ไม่ต้องใส่รหัส เว้นแต่เปิด "ใช้ PIN"): ผู้บันทึก → ผู้ทวนสอบ → ผู้อนุมัติ คนบันทึกทวนสอบของตัวเองไม่ได้ การแก้ไขต้องใส่เหตุผลทุกครั้ง ถ้าแก้หลังทวนสอบ ลายเซ็นถูกล้าง ไม่มีการลบจริง มีแต่ "ยกเลิก" พร้อมเหตุผล ทุกการกระทำต่อกันด้วย hash',
  zh:'签名分 3 级（无需密码，除非开启“使用 PIN”）：记录人 → 验证人 → 批准人，记录人不能验证自己的记录。每次修改必须填写原因，验证后再修改会清除签名。不会真正删除，只能“作废”并填写原因。所有操作以哈希串接。'},
 flow:[{th:'บันทึก',zh:'记录'},{th:'ลงนามผู้บันทึก',zh:'记录人签名'},{th:'ทวนสอบ',zh:'验证'},{th:'อนุมัติ',zh:'批准'},{th:'Audit trail',zh:'审计追踪'}],
 steps:{th:['เปิดบันทึก → ปุ่ม "ลงนาม" → เลือกความหมาย → ยืนยัน','สิทธิ์ทวนสอบ: Director, FSO, QA, หัวหน้ากะ, QC · สิทธิ์อนุมัติ: Director, QA','แก้ไข: ใส่เหตุผลที่ช่องล่างซ้าย','ยกเลิก: ใส่เหตุผล (ยกเลิกไม่ได้ถ้ามีบันทึกอื่นอ้างถึง)','เมนู Audit trail → "ตรวจความสมบูรณ์ของ hash chain"'],
  zh:['打开记录 → “签名” → 选择含义 → 确认','验证权限：总监、食品安全员、QA、班长、QC · 批准权限：总监、QA','修改：在左下角填写原因','作废：填写原因（被其他记录引用时不能作废）','审计追踪菜单 → “校验哈希链完整性”']},
 auto:{th:['ล้างลายเซ็นเมื่อแก้ไขหลังลงนาม','บันทึกค่าเดิม → ค่าใหม่ทุกช่อง','ตรวจจับการแก้ประวัติ'],zh:['签名后修改自动清除签名','记录每个字段的旧值 → 新值','可发现历史篡改']},

  zh:'进入取水车间前对每人进行卫生检查，不合格或健康证过期时系统设为“拒绝进入”且不允许放行。培训计划、设备 PM、GMP 检查、EMP 和虫害控制是 C3、R5、R14、R16、R17 的证据。'},
 flow:['employee','hygiene','training','maintenance','gmp','emp','pest'],
 steps:{th:['ตรวจสุขลักษณะ: เลือกพนักงาน → ติ๊ก 7 ข้อ → ระบบตัดสินผล','แผนอบรม → บันทึกอบรม (เลือกผู้เข้าอบรม) → ทะเบียนพนักงานแสดงหลักสูตรที่ขาด','ซ่อมบำรุง: PM ตามแผน → ระบบคำนวณ PM ครั้งถัดไป ต้องติ๊กส่งมอบพื้นที่ก่อนเดินเครื่อง','ตรวจ GMP: 13 ข้อ ข้อไหนไม่ผ่าน ระบบสร้าง CAPA','EMP: เลือกกลุ่มจุดตรวจ ระบบใส่เกณฑ์ให้ · สัตว์พาหะ: ห้ามกล่องเหยื่อพิษในอาคาร'],

function sbName(k){if(T[k])return T[k].th;return {dash:'ความพร้อมรับการตรวจ',alerts:'แจ้งเตือน',trace:'สอบกลับ / Mock recall',audit:'Audit trail',io:'นำเข้า / ส่งออก Excel',settings:'ตั้งค่า'}[k]||k}
function sbChip(x,cls){if(typeof x==='string')return `<a class="sbc ${cls||''}" href="#/${x}">${esc(sbName(x))}</a>`;return `<span class="sbc t">${esc(SX(x))}</span>`}
function sbRelTable(){const used={};ORDER.forEach(t=>T[t].fields.forEach(f=>{if(['ref','refq','refm'].includes(f.t)&&f.rt!==t){(used[f.rt]=used[f.rt]||new Set()).add(t)}}));
  const autoTo={receiving:['stock','nc'],input:['stock'],washing:['nc'],striking:['nc'],filtration:['nc'],tanktemp:['nc'],labtest:['receiving','nc'],gmp:['capa'],complaint:['capa'],holding:['nc'],dispatch:['nc'],release:['retain']};
  return `<div class="tw"><table class="tbl"><thead><tr><th>${L2('เมนู','菜单')}</th><th>${L2('ถูกเลือกใช้ใน (อ้างอิงต่อ)','被以下菜单引用')}</th><th>${L2('ทำให้เกิด / อัปเดตอัตโนมัติ','自动生成 / 更新')}</th><th>${L2('หลักฐานของรายการตรวจ','对应审核项')}</th></tr></thead><tbody>
   ${ORDER.map(t=>{const refs=AUD.filter(a=>(a.types||[]).some(x=>x[0]===t)||(a.kind==='doc'&&t==='doc')||(t==='doc'&&a.ref==='R19')).map(a=>a.ref);
     return `<tr><td>${sbChip(t)}</td><td>${[...(used[t]||[])].map(x=>sbChip(x)).join(' ')||'—'}</td><td>${(autoTo[t]||[]).map(x=>sbChip(x,'a')).join(' ')||'—'}</td><td>${refs.map(r=>`<span class="ref">${r}</span>`).join(' ')||'—'}</td></tr>`}).join('')}</tbody></table></div>`}

function sbScene(s){const i=SB.indexOf(s);return `<section class="sbs" id="sb_${s.id}">

  <h4>${L2('แผนที่ความเชื่อมโยง','关联地图')}</h4><table class="pt sm"><tbody>${SB_LANES.map(l=>`<tr><th style="width:22%">${esc(SX(l.t))}</th><td>${l.k.map(k=>esc(sbName(k))).join(l.chain?' → ':' · ')}</td></tr>`).join('')}</tbody></table>

   <p class="small">${L2('เชื่อมกับฉาก','关联场景')}: ${s.links.map(l=>SB.findIndex(x=>x.id===l)).join(', ')}</p></div>`).join('')}</div>`+pfoot())}

function printTrace(){const res=UI.trace;if(!res)return;const by={};res.nodes.forEach(n=>(by[n.t]=by[n.t]||[]).push(n.r));const mb=massBalance(res);
  doPrint(ph('รายงานการสอบกลับ'+(res.mode==='back'?' (ย้อนกลับ)':res.mode==='fwd'?' (ไปข้างหน้า)':''),'产品追溯报告',lbl(res.start.t,res.start.r))+`<p>เริ่มจาก <b>${esc(lbl(res.start.t,res.start.r))}</b> (${esc(T[res.start.t].th)}) · ประมวลผล ${esc(res.at)} · ${res.nodes.length} รายการ</p>
   <table class="pt sm"><colgroup><col style="width:14%"><col style="width:20%"><col></colgroup><thead><tr><th>ขั้น</th><th>รหัส</th><th>รายละเอียด / บันทึกที่เกี่ยวข้อง</th></tr></thead><tbody>
   ${CHAIN.filter(([t])=>by[t]).map(([t,,lab])=>by[t].map(r=>{let info='';try{info=T[t].info?T[t].info(r):''}catch(e){}const rel=relOf(t,r._id);
     return `<tr><td>${lab}</td><td><b>${esc(lbl(t,r))}</b></td><td>${esc(info)}${Object.keys(rel).length?'<br>'+Object.entries(rel).map(([rt,l])=>esc(T[rt].th)+' '+l.length+(l.some(x=>x._oos&&x._oos.length)?' <span class="oosp">(OOS)</span>':'')).join(' · '):''}</td></tr>`}).join('')).join('')}</tbody></table>
   <h4>Mass balance — ติดตามได้ ${mbPct(mb)}%</h4><table class="pt sm"><thead><tr><th>รายการ</th><th>รวม</th>${['ส่วนที่ 1','ส่วนที่ 2','ส่วนที่ 3','ส่วนที่ 4'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
   ${mb.map(m=>`<tr><td>${esc(m.label)}</td><td class="n">${nf(m.total)} ${m.unit}</td>${m.parts.map(p=>`<td>${esc(p[0])}: ${nf(p[1])}</td>`).join('')}</tr>`).join('')}</tbody></table>
   <h4>ลูกค้าที่ได้รับสินค้า</h4><table class="pt sm"><thead><tr><th>ลูกค้า</th><th>Dispatch</th><th>ลิตร</th><th>ซีล</th><th>เวลาออก</th></tr></thead><tbody>${(by.dispatch||[]).map(d=>`<tr><td>${esc(d.customer)}</td><td>${esc(d.dlId)}</td><td class="n">${nf(d.qty)}</td><td>${esc(d.seal||'')}</td><td>${fDT(d.departAt)}</td></tr>`).join('')||'<tr><td colspan="5">ไม่มี</td></tr>'}</tbody></table>
   <div class="sig"><div><b>ผู้สอบกลับ</b><br><br>ลงชื่อ ....................................</div><div><b>QA Manager</b><br><br>ลงชื่อ ....................................</div><div><b>Food Safety Director</b><br><br>ลงชื่อ ....................................</div></div>`+pfoot())}

function printCOA(t,id){const rl=byId('release',id);const f=byId('tankfill',rl.fill);if(!f)return toast('ไม่พบ tank fill','bad');
  const lab=recs('labtest').filter(x=>x.fill===f._id).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0]||{};const L0=L();
  const batches=(f.batches||[]).map(q=>byId('input',q.id)).filter(Boolean);const lots=batches.flatMap(b=>(b.lots||[]).map(q=>byId('receiving',q.id))).filter(Boolean);
  const orchards=[...new Set(lots.map(l=>{const h=byId('harvest',l.harvest);const o=h&&byId('orchard',h.orchard);return o?o.code+(o.regNo?' ('+o.regNo+')':''):''}).filter(Boolean))];
  const row=(p,zh,spec,res,ok)=>`<tr><td>${p}<br><span style="font-size:8pt">${zh}</span></td><td>${spec}</td><td class="n ${ok===false?'oosp':''}">${res===''||res==null?'—':esc(res)}</td><td>${ok==null?'—':ok?'Pass 合格':'Fail 不合格'}</td></tr>`;
  const inR=(v,a,b)=>!isNum(v)?null:(L0[a]===''||+v>=+L0[a])&&(L0[b]===''||+v<=+L0[b]);const le=(v,b)=>!isNum(v)?null:+v<=+L0[b];
  doPrint(ph('CERTIFICATE OF ANALYSIS','检验报告 / ใบรับรองผลการวิเคราะห์',rl.relId)+`
   <table class="pt"><colgroup><col style="width:22%"><col style="width:28%"><col style="width:22%"><col style="width:28%"></colgroup><tbody>
   <tr><th>Product 产品</th><td colspan="3">Fresh fragrant coconut water, raw, chilled 香水椰原料水（冷藏）</td></tr>
   <tr><th>COA No. 报告编号</th><td>${esc(rl.relId)}</td><th>Release date 放行日期</th><td>${fDT(rl.at)}</td></tr>
   <tr><th>Tank lot 批次号</th><td>${esc(f.fillId)}</td><th>Tank 储罐</th><td>${esc(f.tank)}</td></tr>
   <tr><th>Volume 数量</th><td>${nf(fillVol(f))} L</td><th>Production date 生产日期</th><td>${[...new Set(batches.map(b=>fD(b.date)))].join(', ')}</td></tr>
   <tr><th>Production batch 生产批次</th><td colspan="3">${batches.map(b=>esc(b.batchId)).join(', ')}</td></tr>
   <tr><th>Raw coconut lots 原料批次</th><td colspan="3">${lots.map(l=>esc(l.lotId)).join(', ')}</td></tr>
   <tr><th>Registered orchards 备案果园</th><td colspan="3">${orchards.map(esc).join(', ')||'—'}</td></tr>
   <tr><th>Storage 储存条件</th><td colspan="3">${L0.tankTMin}–${L0.tankTMax} °C · Shelf life 保质期 ${L0.shelfDays} days</td></tr></tbody></table>
   <table class="pt"><colgroup><col style="width:30%"><col style="width:26%"><col style="width:20%"><col></colgroup><thead><tr><th>Parameter 检测项目</th><th>Specification 标准</th><th>Result 结果</th><th>Conclusion 判定</th></tr></thead><tbody>
   ${row('Sensory','感官（香气、色泽、无异味）','Typical fragrant, no off-odor',lab.sensory==null?'':lab.sensory?'Conforms':'Not conform',lab.sensory==null?null:!!lab.sensory)}
   ${row('Brix','糖度 (°Bx)',L0.brixMin+' – '+L0.brixMax,lab.brix,inR(lab.brix,'brixMin','brixMax'))}
   ${row('pH','pH',L0.phMin+' – '+L0.phMax,lab.ph,inR(lab.ph,'phMin','phMax'))}
   ${row('Total plate count','菌落总数 (CFU/ml)','≤ '+nf(L0.tpcMax),lab.tpc,le(lab.tpc,'tpcMax'))}
   ${row('Coliforms','大肠菌群 (CFU/ml)','≤ '+nf(L0.coliMax),lab.coli,le(lab.coli,'coliMax'))}
   ${row('Yeast & mold','酵母霉菌 (CFU/ml)','≤ '+nf(L0.ymMax),lab.ym,le(lab.ym,'ymMax'))}</tbody></table>
   <p><b>Conclusion 结论:</b> ${/Released/.test(rl.decision||'')?'The lot conforms to specification and is released. 该批次符合标准，准予放行。':esc(rl.decision||'')}</p>
   <p style="font-size:8pt">Micro results marked “—” are pending at release time; raw coconut water is a perishable chilled material. 微生物结果“—”表示放行时仍在检测中。</p>`+sigBox('release',rl)+pfoot())}
