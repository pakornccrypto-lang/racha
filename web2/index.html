<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSMS มะพร้าวน้ำหอม v1.5.0 (Draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style id="pageStyle">@page{size:A4 portrait;margin:12mm 10mm 14mm}</style>
<style>
:root{
  --frond:#0F4C45;--frond2:#17695E;--frond3:#E2EFE9;--water:#F3F7F5;--paper:#fff;
  --ink:#17201D;--muted:#5D6B66;--line:#D6E1DB;--line2:#EAF0ED;
  --husk:#7A4E24;--husk2:#F4EADF;
  --ok:#2E7D4F;--okb:#E2F3E8;--warn:#9A5F0C;--warnb:#FBEFD9;--bad:#B3261E;--badb:#FBE4E1;
  --info:#2B5F9E;--infob:#E4EDF8;--na:#6F7A76;--nab:#ECEFEE;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Tahoma,sans-serif;font-size:15px;color:var(--ink);background:var(--water);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB8A9;outline-offset:2px}
.n,td.n{font-variant-numeric:tabular-nums;text-align:right}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--frond);padding:20px}
.lg{background:#fff;border-radius:16px;padding:28px 28px 22px;width:min(440px,100%)}
.lg h1{font-size:21px;font-weight:700;color:var(--frond)}
.lg p{margin:6px 0 18px;color:var(--muted);font-size:14px}
.lg .row{margin-bottom:12px}
.lg label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.lg .foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* layout */
#app{display:none}
#app.on{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
#nav{background:var(--frond);color:#E4F0EB;height:100vh;position:sticky;top:0;overflow:auto;padding:14px 10px 40px}
.brand{padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.brand b{display:block;font-size:16px;color:#fff;font-weight:700;line-height:1.3}
.brand small{display:block;color:#A8C8BE;font-size:12px;margin-top:2px}
.ver{display:inline-block;background:var(--husk2);color:var(--husk);font-weight:700;font-size:12px;border-radius:4px;padding:1px 8px;margin-top:8px}
.ng{margin:6px 0 2px}
.ng>.gh{display:block;padding:8px 10px 3px;font-size:12px;color:#9DC0B5;font-weight:600}
.ng a{display:flex;gap:8px;align-items:baseline;padding:6px 10px 6px 12px;border-radius:7px;color:#E4F0EB;text-decoration:none;font-size:14px;line-height:1.35}
.ng a:hover{background:rgba(255,255,255,.08)}
.ng a.on{background:#fff;color:var(--frond);font-weight:600}
.ng a .c{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-weight:600}
main{min-width:0}
#top{position:sticky;top:0;z-index:20;background:rgba(243,247,245,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:9px 18px;flex-wrap:wrap}
#top .file{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
#top .file b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .file span{font-size:12px;color:var(--muted)}
#top .file span.warn{color:var(--warn);font-weight:600}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 4px;font-size:13px;cursor:pointer}
.me i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--frond);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.btn.menu-btn{display:none}
#view{padding:20px 22px 60px;max-width:1400px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vh .t{margin-right:auto}
.vh .t .zh{color:var(--muted);font-size:14px;margin-top:2px}
.refs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.ref{font-size:11.5px;font-weight:700;color:var(--frond);background:var(--frond3);border-radius:4px;padding:0 6px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid #C6D5CE;background:#fff;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--frond2)}
.btn.p{background:var(--frond);color:#fff;border-color:var(--frond)}
.btn.p:hover{background:var(--frond2)}
.btn.d{color:var(--bad);border-color:#E4B9B4}
.btn.s{height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.g{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #C3D2CB;border-radius:8px;background:#fff;min-height:42px}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--frond);margin:0;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;min-height:38px;height:38px;padding:4px 10px}
.bar .q{flex:1;min-width:180px}

/* cards & tables */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card>h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;background:#FAFCFB;position:sticky;top:0}
.tbl td{border-bottom:1px solid var(--line2);padding:8px 10px;vertical-align:top;font-size:14px;min-width:86px;max-width:340px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.oos td:first-child{box-shadow:inset 4px 0 var(--bad)}
.tbl tr.void td{color:#9AA5A1;text-decoration:line-through}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7FBF9}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.lot{font-weight:600;color:var(--husk);background:var(--husk2);padding:0 7px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--nab);color:var(--na)}
.st.ok{background:var(--okb);color:var(--ok)}.st.warn{background:var(--warnb);color:var(--warn)}.st.bad{background:var(--badb);color:var(--bad)}.st.info{background:var(--infob);color:var(--info)}
.sg{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);color:#A3AFAA;border-radius:4px;padding:0 5px;margin-right:2px}
.sg.on{border-color:var(--ok);color:var(--ok);background:var(--okb)}
.x-ok{color:var(--ok);font-weight:700}.x-bad{color:var(--bad);font-weight:700}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* readiness */
.ready-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.score{font-size:46px;font-weight:700;color:var(--frond);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
.rgh{font-size:14px;font-weight:600;margin:14px 0 8px;color:#33423D}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.rt{all:unset;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:8px 10px 9px;cursor:pointer;min-height:84px;display:flex;flex-direction:column;gap:2px}
.rt:hover{border-color:var(--c)}
.rt:focus-visible{outline:3px solid #7FB8A9}
.rt .code{font-size:17px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.rt .code em{font-style:normal;font-size:11.5px;color:var(--c);font-weight:700}
.rt .nm{font-size:12.5px;color:#3A4843;line-height:1.35}
.rt .zh{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:auto}
.c-ok{--c:#2E7D4F}.c-warn{--c:#C98A1E}.c-progress{--c:#2B5F9E}.c-missing{--c:#B3261E}.c-expired{--c:#7A1C16}.c-na{--c:#A3AFAA}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.alert-row:last-child{border-bottom:0}
.alert-row .st{margin-top:2px}

/* modal & form */
#modal{position:fixed;inset:0;background:rgba(12,38,33,.48);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 12px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:min(900px,100%);box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column}
.mbox.wide{width:min(1180px,100%)}
.mbox.narrow{width:min(460px,100%)}
.mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.mh h3{margin-right:auto}
.mh .zh{display:block;font-size:13px;color:var(--muted);font-weight:500}
.mh .x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:18px;color:var(--muted)}
.mh .x:hover{background:var(--water)}
.mb{padding:16px 20px}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}
.mf .left{margin-right:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld.w{grid-column:1/-1}
.fld>label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#33423D}
.fld>label .req{color:var(--bad)}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.fld.bad input,.fld.bad select,.fld.bad .tg{border-color:var(--bad);background:var(--badb)}
.oosmsg{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:3px}
.oosmsg:empty{display:none}
output.auto{display:block;min-height:42px;padding:9px 11px;background:var(--frond3);border-radius:8px;font-weight:600;color:var(--frond);white-space:pre-wrap}
.tg{display:flex;align-items:center;gap:10px;min-height:42px;padding:7px 11px;border:1px solid #C3D2CB;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;margin:0;line-height:1.35}
.mc{display:flex;flex-wrap:wrap;gap:6px}
.mc label{display:inline-flex;gap:6px;align-items:center;border:1px solid #C3D2CB;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.mc input{width:16px;height:16px}
.mc label:has(input:checked){background:var(--frond3);border-color:var(--frond);color:var(--frond);font-weight:600}
.rl{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;border:1px solid #C3D2CB;border-radius:8px;padding:8px}
.rl label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.rq{display:flex;flex-direction:column;gap:6px}
.rq .r{display:grid;grid-template-columns:1fr 130px 36px;gap:6px}
.rq .r .btn{height:42px;padding:0;justify-content:center}
.oosonly{display:none}
.showimm .oosonly{display:block}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.bad{background:var(--badb);color:var(--bad);font-weight:600}
.banner.warn{background:var(--warnb);color:var(--warn)}
.banner.info{background:var(--infob);color:var(--info)}
.signrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.signrow input[type=password]{width:120px;min-height:38px;height:38px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#17201D;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}

/* trace */
.chain{display:flex;gap:10px;overflow:auto;padding-bottom:6px}
.lv{min-width:200px;flex:1}
.lv>h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.node{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.node.start{border:2px solid var(--husk)}
.node.oos{border-left:4px solid var(--bad)}
.node .rel{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.node .rel button{all:unset;cursor:pointer;font-size:11.5px;background:var(--water);border-radius:4px;padding:0 6px}
.node .rel button.b{background:var(--badb);color:var(--bad);font-weight:600}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--husk)}

/* manual */
.man{max-width:820px}
.man h3{margin:22px 0 8px;color:var(--frond)}
.man p,.man li{font-size:15px;line-height:1.65}
.man ol,.man ul{padding-left:22px}
.man code{background:var(--water);padding:0 5px;border-radius:4px}

@media (max-width:1000px){
  #app.on{grid-template-columns:1fr}
  #nav{position:fixed;left:-290px;width:280px;z-index:50;transition:left .2s;height:100%}
  #nav.open{left:0;box-shadow:0 0 0 100vw rgba(0,0,0,.35)}
  .btn.menu-btn{display:inline-flex}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  #view{padding:14px 12px 60px}
  .fg,.grid2,.grid3{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  #top .btn.saveas{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print */
#print{display:none}
#tip{position:fixed;z-index:95;max-width:340px;background:#17201D;color:#F2F7F4;border-radius:9px;padding:9px 12px;font-size:13.5px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','IBM Plex Sans Thai',sans-serif}
#tip.on{opacity:1;transform:none}
#tip b{color:#F4D9B8}
.hsw{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 10px;border:1px solid #C6D5CE;border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
.hsw .k{width:30px;height:17px;border-radius:999px;background:#C9D3CF;position:relative;transition:background .15s}
.hsw .k::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.hsw.on{color:var(--frond);border-color:var(--frond)}
.hsw.on .k{background:var(--frond)}.hsw.on .k::after{left:15px}
.hsw:focus-visible{outline:3px solid #7FB8A9}
body.nopin #frmPin,body.nopin .fld:has(#sgPin),body.nopin .fld:has(#vdP),body.nopin .fld:has(#swP),body.nopin .fld:has(#nuPin),body.nopin button[onclick="changePin()"],body.nopin button[onclick^="resetPin"]{display:none!important}
@media (hover:none){#tip{display:none}}
.sbl{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.sbl:first-of-type{border-top:0}
.sblh{font-size:13px;font-weight:600;color:var(--muted);padding-top:4px}
.sblr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sbc{display:inline-flex;align-items:center;min-height:30px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink);text-decoration:none;line-height:1.3}
a.sbc:hover{border-color:var(--frond2)}
.sbc.c{background:var(--husk2);border-color:#E3CDB6;color:var(--husk);font-weight:600}
.sbc.a{background:var(--frond3);border-color:#BFD8CD;color:var(--frond)}
.sbc.t{background:var(--water);border-style:dashed}
.sba{color:var(--husk);font-weight:700}
.sbnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sbs{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sbh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;background:var(--frond);color:#E4F0EB}
.sbh h3{color:#fff;margin-right:auto}
.sbn{background:var(--husk2);color:var(--husk);font-weight:700;border-radius:4px;padding:1px 8px;font-size:13px}
.sbb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.sbpic{padding:16px;background:var(--water);border-right:1px solid var(--line)}
.sbpic p{margin:12px 0 0;font-size:14.5px;line-height:1.7}
.sbflow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px;border:2px dashed #C9D8D1;border-radius:10px;background:#fff}
.sbtxt{padding:14px 18px}
.sbtxt h4{margin:4px 0 6px;font-size:14px;color:var(--frond)}
.sbtxt ol,.sbtxt ul{margin:0 0 10px;padding-left:20px;font-size:14px;line-height:1.6}
.sbf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
@media (max-width:800px){.sbb{grid-template-columns:1fr}.sbpic{border-right:0;border-bottom:1px solid var(--line)}.sbl{grid-template-columns:1fr}}
#print .psc{break-inside:avoid;margin-bottom:8px}
#print .psc p{margin:3px 0}
.lang{display:inline-flex;border:1px solid #C6D5CE;border-radius:8px;overflow:hidden;background:#fff}
.lang button{all:unset;cursor:pointer;padding:0 12px;height:36px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--frond);color:#fff}
.lang button:focus-visible{outline:3px solid #7FB8A9}
.lg .lang{margin-bottom:14px}
@media print{
  html,body{background:#fff}
  #app,#login,#modal,#toast{display:none!important}
  #print{display:block;color:#000;font-size:9.5pt;line-height:1.4}
}
#print .ph{display:grid;grid-template-columns:1.25fr 2fr 1.05fr;border:1px solid #333;margin-bottom:8px}
#print .ph>div{padding:5px 7px}
#print .ph>div+div{border-left:1px solid #333}
#print .ph .co{font-size:8.5pt}
#print .ph .co b{font-size:9.5pt}
#print .ph .tt{text-align:center;display:flex;flex-direction:column;justify-content:center}
#print .ph .tt b{font-size:12.5pt}
#print .ph .tt span{font-size:10pt}
#print .ph .mt{font-size:8pt;line-height:1.35}
#print table.pt{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:8px}

function uid(){try{return crypto.randomUUID()}catch(e){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}}
function dObj(s){if(!s)return null;if(s instanceof Date)return new Date(s.getTime());s=String(s);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+'T00:00');const d=new Date(s);return isNaN(d)?null:d}
function isoD(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isoDT(d){d=d||new Date();return isoD(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
const today=()=>isoD(), nowDT=()=>isoDT();
function stamp(){const d=new Date();return isoD(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function fD(s){const d=dObj(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():''}
function fDT(s){const d=dObj(s);return d?fD(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()):''}
function yymmdd(s){const d=dObj(s)||new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())}
function addDays(s,n){const d=dObj(s);if(!d)return '';d.setDate(d.getDate()+(+n||0));return isoD(d)}
function addMonths(s,n){const d=dObj(s);if(!d)return '';d.setMonth(d.getMonth()+(+n||0));return isoD(d)}
function daysTo(s){const d=dObj(s);if(!d)return null;d.setHours(0,0,0,0);const t=dObj(today());return Math.round((d-t)/864e5)}
function hrs(a,b){const x=dObj(a),y=b?dObj(b):new Date();if(!x||!y)return null;return Math.round((y-x)/36e5*10)/10}

/* ---------- crypto (AES-256-GCM, built-in key: no password needed) ---------- */
const enc=s=>new TextEncoder().encode(s);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',enc(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const B64={from(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)},
  to(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}};
const SECRET='ICOCO|FSMS-COCO|built-in-key|v1|5f1c9a7e';
let _key=null;
async function cryptoKey(){if(_key)return _key;
  const base=await crypto.subtle.importKey('raw',enc(SECRET),'PBKDF2',false,['deriveKey']);
  _key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc('fsms-coco-salt-2569'),iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return _key}
async function encryptObj(obj){const k=await cryptoKey();const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc(JSON.stringify(obj))));
  return JSON.stringify({format:'FSMS-COCO-ENC',app:APP.name,version:APP.ver,savedAt:stamp(),alg:'AES-256-GCM',iv:B64.from(iv),data:B64.from(ct)})}
async function decryptText(txt){const j=JSON.parse(txt);
  if(j.format==='FSMS-COCO-ENC'){const k=await cryptoKey();
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B64.to(j.iv)},k,B64.to(j.data));
    return JSON.parse(new TextDecoder().decode(pt))}
  if(j.meta&&j.rec)return j;
  throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ข้อมูลของระบบ FSMS')}

let LANG=(()=>{try{return localStorage.getItem('fsms-lang')||'th'}catch(e){return 'th'}})();
const THAI=/[\u0E00-\u0E7F]/;
let ZHMAP=null,ZHRE=null;
function zhInit(){if(ZHMAP)return;ZHMAP=new Map();ZH_SRC.split('\n').forEach(l=>{const i=l.indexOf('|');if(i>0)ZHMAP.set(l.slice(0,i).replace(/^\s+/,''),l.slice(i+1).replace(/\r$/,''))});
  const keys=[...ZHMAP.keys()].filter(Boolean).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));ZHRE=new RegExp(keys.join('|'),'g')}
function toZh(s){if(s==null)return s;s=String(s);if(!THAI.test(s))return s;zhInit();return s.replace(ZHRE,m=>ZHMAP.get(m)).replace(/ {2,}/g,' ')}
function tr(s){return LANG==='zh'?toZh(s):s}
const L2=(th,zh)=>LANG==='zh'?zh:th;
function trNode(root){if(LANG!=='zh'||!root)return;
  if(root.nodeType===3){const p=root.parentNode;if(p&&!skipTr(p)){const v=root.nodeValue;if(THAI.test(v)){const t=toZh(v);if(t!==v)root.nodeValue=t}}return}
  if(root.nodeType!==1||skipTr(root))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while((n=w.nextNode()))list.push(n);
  list.forEach(n=>{const p=n.parentNode;if(!p||skipTr(p))return;const v=n.nodeValue;if(THAI.test(v)){const t=toZh(v);if(t!==v)n.nodeValue=t}});
  const els=root.querySelectorAll?[root,...root.querySelectorAll('[placeholder],[title],[aria-label]')]:[];
  els.forEach(el=>{if(!el.getAttribute)return;['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v&&THAI.test(v)){const t=toZh(v);if(t!==v)el.setAttribute(a,t)}})})}
function skipTr(el){if(!el||el.nodeType!==1)return false;if(el.nodeName==='TEXTAREA'||el.nodeName==='SCRIPT'||el.nodeName==='STYLE')return true;return !!(el.closest&&el.closest('[data-notr]'))}
const trObs=new MutationObserver(ms=>{if(LANG!=='zh')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else if(m.type==='attributes')trNode(m.target);else m.addedNodes.forEach(trNode)}});
function trStart(){trObs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']})}

<h3>1. 开始使用</h3><ol>
<li>用 Chrome 或 Edge 打开 <code>FSMS_Coconut_v1.3.0.html</code>（推荐，可直接覆盖保存原文件）</li>
<li>没有登录页：打开文件即可直接以本机最近的用户身份使用。首次为 <b>系统管理员（PIN 1234）</b>，系统会立即要求修改 PIN · 换人使用：点击右上角姓名 → 切换用户 → 输入 PIN</li>
<li>在 <b>设置</b> 中修改公司名称（可填写中文名称）、储罐、生产线、过滤级，并 <b>按 HACCP 计划修改全部标准限值</b>（默认值为示例值）</li>
<li>为每位记录或签名人员添加账户和角色，禁止共用账户</li>
<li>点击 <b>保存</b> 生成数据文件（加密 .json），之后点击“保存”将覆盖原文件</li>
<li>想先试用：设置 → <b>添加示例数据</b>（可通过“新建数据文件”清除）</li>
<li>右上角可随时切换 <b>ไทย / 中文</b>，每个用户的语言偏好会被记住</li></ol>
<h3>2. 保存与打开文件</h3><ul>
<li>数据文件使用程序内置密钥以 AES-256-GCM 加密，<b>每次保存无需输入密码</b>，其他程序无法读取</li>
<li><b>保存</b> = 覆盖原文件（Chrome/Edge）· 其他浏览器每次会下载新文件 · <b>另存为新文件</b> = 单独文件，如月度备份 · 可按 Ctrl+S</li>
<li>每次更改后系统会在本机<b>自动备份</b>（同样加密）。即使未保存就关闭浏览器，重新打开数据仍在，但建议每天保存到文件</li>
<li><b>打开文件</b>后系统以最近用户继续使用（文件中没有该用户时使用系统管理员）— 可在右上角切换用户</li></ul>
<h3>3. 按工艺的日常工作</h3><ol>
<li><b>果园备案清单</b> → <b>果园采收记录</b>（生成 H… 编号）</li>
<li><b>香水椰原料验收</b>：选择采收记录，系统生成批次号 = 果园编号 + 采收日期 + 序号，并自动判定接收/隔离/拒收</li>
<li>按计划进行 <b>椰子暂存区检查</b> 和 <b>农残检测</b></li>
<li><b>生产投料记录</b>：选择批次 + 数量。系统只显示可用批次（未隔离、未用完），按暂存时间排序以便先进先出，混合类型或超出暂存时限会被拦截</li>
<li><b>椰壳清洗消毒 → 破壳取水 → 多级粗过滤</b> 关联到生产批次</li>
<li>先做 <b>储罐 CIP</b>，再 <b>进暂存罐</b>（储罐未通过 CIP、罐内仍有料液、香水椰与普通椰混合或违反进罐规则如 1 罐 1 批次时系统会拦截）</li><li>放行前为每个储罐 <b>留样</b></li>
<li>按设定频率记录 <b>储罐温度</b>（默认每 2 小时）</li>
<li>录入储罐 <b>化验结果</b> → <b>成品放行检验</b>（系统自动检查时间、温度、NC、化验结果及未验证记录）→ 打印中英文 COA</li>
<li><b>椰子水出料（冷链）</b> → <b>成品销售台账</b></li>
<li>食品安全员每天记录 <b>日管控</b>、每周 <b>周排查</b>，总监每月记录 <b>月调度</b></li></ol>
<h3>4. 系统自动功能</h3><ul>
<li>自动生成所有编号：批次、生产批次、储罐批次、RL、DL、NC、CAPA、仪器、文件</li>
<li>自动计算：合计、暂存时长、Brix 差值、到期/校准/PM 日期、留样到期日、供应商评分与批准状态、化学品库存</li>
<li>超标（OOS）：字段立即变红，必须填写立即纠正，系统 <b>自动创建 NC 并隔离产品</b>（批次/生产批次/储罐）；与产品无关时自动创建 CAPA</li>
<li>某批次的化验结果 → 自动更新验收记录中的微生物结果</li>
<li>新版本文件获批准 → 旧版本自动变为 Obsolete</li>
<li>客诉 / GMP 检查不合格 → 自动创建 CAPA</li>
<li>预警：30/60/90 天到期、椰子/储罐暂存时限、温度记录缺失、未关闭 NC、逾期 CAPA、待验证 OOS、日管控、逾期培训计划</li></ul>
<h3>5. 电子签名与修改</h3><ul>
<li>使用 PIN 签名，含义分 3 级：记录人 → 验证人 → 批准人 · 记录人不能验证自己的记录</li>
<li>验证权限：总监、食品安全员、QA、班长、QC · 批准权限：总监、QA</li>
<li>每次修改记录必须填写原因。验证/批准后再修改，该签名会被清除，需重新签名</li>
<li>不会真正删除数据，只能“作废”，须填写原因并输入 PIN；被其他记录引用时不能作废</li>
<li>审计追踪记录所有操作并以哈希链接，点击“校验哈希链完整性”可证明历史未被篡改</li></ul>
<h3>6. 审核准备度（首页）</h3><ul>
<li>34 个方格 = 客户必查项目 D1–D15（文件类）和 R1–R19（记录类），按审核期内的真实数据计算</li>
<li>颜色：绿 齐全 · 黄 有缺口/即将到期 · 蓝 编制中 · 红 缺失 · 深红 过期 · 灰 不适用</li>
<li>文件类 D：进入 <b>文件控制清单</b> → “生成必备文件清单”，完善内容后逐份签名批准</li>
<li>不适用的项目（如未使用食品添加剂、无委托加工）：点击该方格并填写 N/A 理由</li></ul>
<h3>7. 追溯与召回演练</h3><ol>
<li>在 <b>追溯</b> 菜单输入任意编号（果园、H…、批次、PB…、储罐、RL…、DL…、铅封号、发票号）</li>
<li>选择反向 / 正向 / 双向，系统显示追溯链、每个环节的 QC 记录（红色 = 有超标）、物料平衡及客户名单</li>
<li>召回演练：点击“开始计时” → 追溯 → “停止计时”，系统打开演练记录表并自动填入用时和可追溯百分比</li></ol>
<h3>8. Excel 导入 / 导出</h3><ul>
<li>下载 <b>空白模板</b> → 在对应工作表填入历史数据 → 导入，系统自动匹配列</li>
<li>其他 Excel 文件也可导入：为每个工作表选择记录类型并手动匹配列，导入前核对前 5 行</li>
<li>日期支持 日/月/年（公历或佛历）· 引用字段（如批次）请填写系统中已有的编号 · 多个项目用 ; 分隔，数量写作 编号:数量</li>
<li>中文界面导出的表头和选项为中文，导入时系统可自动识别中文或泰文选项</li></ul>
<h3>9. A4 打印 / PDF</h3><ul>
<li>每条记录都有 <b>打印 A4</b>，每个列表都有 <b>打印列表 A4</b>（横向）· 首页可打印准备度报告 · 追溯可打印报告 · 放行可打印 COA</li>
<li>在打印窗口选择“另存为 PDF”，纸张 A4，边距“默认”· 关闭浏览器的“页眉和页脚”以保持页眉整洁</li>
<li>中文界面打印的报告全部为中文（公司名称使用设置中的中文或英文名称）</li></ul>
<h3>10. 本版本限制</h3><ul>
<li>单文件本地使用：不能多人同时使用，请轮流传递文件，或在现场使用一台公用电脑</li>
<li>哈希链可以发现篡改，但无法 100% 防止，因为文件在用户手中 — 中央数据库版本（Supabase）将解决此问题</li>
<li>暂不支持在系统内附加 PDF/图片，请在“文件存放位置 / 链接”或备注中填写链接</li>
<li>用户自行输入的文字（姓名、备注等）按原样显示，不会自动翻译</li></ul>
<h3>11. 连接云端（Supabase）</h3><ol>
<li><b>仅需一次（管理员）：</b>Supabase → SQL Editor → 粘贴“查看 Supabase 设置 SQL”中的脚本并运行</li>
<li>Project Settings → API（Data API）→ Exposed schemas → 添加 <code>fsms</code> 并保存</li>
<li>Authentication → Users → Add user，创建工厂账户（如 QA 公共邮箱），勾选 Auto confirm，然后运行 SQL 第 6 步把该账户加入 fsms.members</li>
<li><b>主电脑（已有数据）：</b>☁ 连接云端 → 输入第 3 步的邮箱/密码 → 系统询问是否上传初始数据 → 确定</li>
<li><b>其他设备：</b>打开同一个 HTML 文件 → 点击顶部 ☁ 连接云端 → 输入相同邮箱/密码 → 选择“使用云端数据” → 点击右上角姓名切换为自己的用户（输入 PIN）</li>
<li>Supabase 账户只用于设备访问数据；签名和权限仍使用系统内各人的用户/PIN</li>
<li>“保存”文件功能仍可使用，建议每周保存一次备份文件 · 连接云端时打开文件，系统会询问是用文件数据覆盖云端，还是继续使用云端数据</li></ol>

function migrate(db){const d=defaultSettings();const oldR=Object.assign({},(db.settings&&db.settings.rules)||{});const fromVer=(db.meta&&db.meta.ver)||'';db.settings=Object.assign({},d,db.settings||{});
  db.settings.limits=Object.assign({},d.limits,db.settings.limits||{});db.settings.rules=Object.assign({},d.rules,db.settings.rules||{});
  db.settings.na=db.settings.na||{};['tanks','lines','filters','zones','envZones'].forEach(k=>{if(!Array.isArray(db.settings[k]))db.settings[k]=d[k]});
  db.rec=db.rec||{};ORDER.forEach(t=>{if(!Array.isArray(db.rec[t]))db.rec[t]=[]});db.audit=db.audit||[];db.users=db.users||[];db.meta=db.meta||{};
  /* v1.2.0 migrations */
  if(oldR.tankBatchMode==null&&'sameDayTank' in oldR)db.settings.rules.tankBatchMode=oldR.sameDayTank?'sameDay':'single';
  if(!['single','sameDay','free'].includes(db.settings.rules.tankBatchMode))db.settings.rules.tankBatchMode='single';

  db.rec.supplier.forEach(s=>{if(s.cert2Exp!==undefined){if(!s.staffLicExp)s.staffLicExp=s.cert2Exp;delete s.cert2Exp}});

  return db}

function recs(t,incVoid){const a=DB.rec[t]||(DB.rec[t]=[]);return incVoid?a:a.filter(r=>!r._void)}
function byId(t,id){if(!id)return null;return (DB.rec[t]||[]).find(r=>r._id===id)||null}
function lbl(t,r){if(!r)return '';const o=T[t];if(o.idf&&r[o.idf])return r[o.idf];if(o.lbl){const x=o.lbl(r);if(x)return x}
  return r.name||r.title||(o.date&&r[o.date]?(o.date==='at'||o.date==='recvAt'||o.date==='start'||o.date==='departAt'?fDT(r[o.date]):fD(r[o.date])):'')||String(r._id||'').slice(0,6)}
function lblId(t,id){const r=byId(t,id);return r?lbl(t,r):''}
function userName(id){const u=DB.users.find(x=>x.id===id);return u?u.name:''}
function derive(t,r){const o=T[t];for(const f of o.fields){if(f.t==='auto'){try{r[f.k]=f.f(r)}catch(e){r[f.k]=''}}}if(o.derive)o.derive(r);return r}
function derived(t,r){return derive(t,Object.assign({},r))}
function oosOf(t,r){const o=T[t],out=[];for(const f of o.fields){const v=r[f.k];
  if(f.must&&f.t==='chk'&&!v)out.push({k:f.k,msg:'ไม่ผ่าน: '+f.l});
  if(f.chk){let m=null;try{if(f.t==='multi'||f.t==='chk'||(v!==''&&v!=null))m=f.chk(v,r)}catch(e){}if(m)out.push({k:f.k,msg:f.l.replace(/\s*\(.*?\)\s*$/,'')+': '+m})}}
  return out}
function genIds(t,r){T[t].fields.forEach(f=>{if(f.t==='id'&&!r[f.k]&&f.gen)r[f.k]=f.gen(r)})}
function nextCode(t,k,prefix,n){let max=0;(DB.rec[t]||[]).forEach(r=>{const v=r[k];if(v&&String(v).startsWith(prefix)){const x=parseInt(String(v).slice(prefix.length),10);if(x>max)max=x}});return prefix+pad(max+1,n)}
function shiftNow(){const h=new Date().getHours();return h>=6&&h<14?SHIFT[0]:h>=14&&h<22?SHIFT[1]:SHIFT[2]}
function newRec(t,preset){const r={};T[t].fields.forEach(f=>{let d=f.def;if(typeof d==='function')d=d();
  if(d==='today')d=today();else if(d==='now')d=nowDT();else if(d==='me')d=ME?ME.id:'';else if(d==='auto'&&f.k==='shift')d=shiftNow();
  if(d!==undefined)r[f.k]=Array.isArray(d)?d.slice():d;else if(['multi','refm','refq'].includes(f.t))r[f.k]=[]});
  return Object.assign(r,preset||{})}

/* ---- lots, tanks, holds ---- */
function ncFor(id){return recs('nc').filter(n=>n.lot===id||n.batch===id||n.fill===id)}
const ncOpen=n=>!n.disposition||n.disposition==='รอพิจารณา';
function isHeld(id){return ncFor(id).some(ncOpen)}
function lotIssued(id){return sum(recs('input').flatMap(x=>(x.lots||[]).filter(q=>q.id===id).map(q=>q.q)))}
function lotAvail(l){if(!l)return 0;return (+l.qty||0)-(+l.rejQty||0)-lotIssued(l._id)}
function lotAgeH(l){return l?hrs(l.recvAt):null}
function lotUsable(l){if(!l)return false;const ncs=ncFor(l._id);if(ncs.some(n=>/ทำลาย|คืน/.test(n.disposition||'')))return false;if(ncs.some(ncOpen))return false;
  const d=derived('receiving',l).decision;if(/Rejected/.test(d))return false;if(/Hold/.test(d))return ncs.some(n=>/ลดเกรด|ยอมรับพิเศษ/.test(n.disposition||''));return true}
function lotPT(l){if(!l)return '';if(ncFor(l._id).some(n=>/ลดเกรด/.test(n.disposition||'')))return PT[1];return derived('receiving',l).ptype}
function fillVol(f){return sum((f.batches||[]).map(q=>q.q))}
function fillDispatched(id){const rel=recs('release').filter(x=>x.fill===id).map(x=>x._id);return sum(recs('dispatch').filter(d=>rel.includes(d.release)).map(d=>d.qty))}
function fillRemain(id){const f=byId('tankfill',id);return f?fillVol(f)-fillDispatched(id):0}
function fillStatus(f){if(!f)return '';if(f.closed)return 'ปิดถัง';const id=f._id;
  if(id){const ncs=ncFor(id);if(ncs.some(n=>/ทำลาย|คืน/.test(n.disposition||'')))return 'ปิด (ทำลาย)';if(ncs.some(ncOpen))return 'กัก (Hold)';
    const vol=fillVol(f);if(vol>0&&fillDispatched(id)>=vol)return 'ส่งออกครบ';
    const rel=recs('release').filter(x=>x.fill===id);if(rel.some(x=>/Rejected/.test(x.decision||'')))return 'ไม่ผ่าน';if(rel.some(x=>/Released/.test(x.decision||'')))return 'ปล่อยแล้ว'}
  const age=hrs(f.start);if(age!=null&&age>lim('tankHoursMax'))return 'เกินเวลา';return 'พักในถัง'}
function cipOk(tank,start,selfId){const prev=recs('tankfill').filter(x=>x._id!==selfId&&x.tank===tank&&(x.start||'')<(start||'')).map(x=>x.start).sort().pop()||'';
  const ok=recs('cip').some(x=>x.equip===tank&&(x.at||'')>prev&&(x.at||'')<=(start||'9999')&&derived('cip',x).result!=='ไม่ผ่าน');
  return ok?true:'ถัง '+tank+' ยังไม่มีบันทึก CIP ที่ผ่าน หลังการใช้งานครั้งก่อน'+(prev?' ('+fDT(prev)+')':'')+' — บันทึก CIP ก่อนเติมถัง'}
function releaseBlockers(fid){const f=byId('tankfill',fid);if(!f)return fid?['ไม่พบ tank fill']:[];const b=[];
  const age=hrs(f.start);if(age>lim('tankHoursMax'))b.push('เกินเวลาพักในถัง ('+age+' / '+lim('tankHoursMax')+' ชม.)');
  if(isHeld(fid))b.push('มี NC เปิดอยู่ (กักกัน)');
  const temps=recs('tanktemp').filter(x=>x.fill===fid).sort((a,c)=>(c.at||'').localeCompare(a.at||''));
  if(!temps.length)b.push('ยังไม่มีบันทึกอุณหภูมิถัง');else if(oosOf('tanktemp',temps[0]).length)b.push('อุณหภูมิล่าสุด '+temps[0].temp+'°C ผิดเกณฑ์');
  const labs=recs('labtest').filter(x=>x.fill===fid);if(!labs.length)b.push('ยังไม่มีผลแล็บของถังนี้');else if(labs.some(x=>derived('labtest',x).result==='ไม่ผ่าน'))b.push('มีผลแล็บไม่ผ่าน');
  const bids=(f.batches||[]).map(q=>q.id);
  bids.forEach(id=>{if(isHeld(id))b.push('Batch '+lblId('input',id)+' ถูกกัก');const bt=byId('input',id);((bt&&bt.lots)||[]).forEach(q=>{if(isHeld(q.id))b.push('Lot '+lblId('receiving',q.id)+' ถูกกัก')})});
  if(DB.settings.rules.requireOprpBeforeRelease){[...new Set(bids)].forEach(id=>{const bl=lblId('input',id);
      if(!recs('washing').some(x=>x.batch===id))b.push('Batch '+bl+' ไม่มีบันทึก OPRP ล้างเปลือก');
      if(!recs('striking').some(x=>x.batch===id))b.push('Batch '+bl+' ไม่มีบันทึกกะเทาะเอาน้ำ');
      DB.settings.filters.forEach(st=>{if(!recs('filtration').some(x=>x.batch===id&&x.stage===st))b.push('Batch '+bl+' ไม่มีบันทึกกรอง '+st)})})}
  if(DB.settings.rules.requireRetainBeforeRelease&&!recs('retain').some(x=>x.fill===fid))b.push('ยังไม่มีบันทึกเก็บตัวอย่าง (留样) ของถังนี้');
  if(DB.settings.rules.requireVerify){const unv=[];[['washing','batch'],['striking','batch'],['filtration','batch']].forEach(([t,k])=>recs(t).forEach(r=>{if(bids.includes(r[k])&&r._oos&&r._oos.length&&!(r._sig&&r._sig.verified))unv.push(T[t].th)}));
    recs('tanktemp').forEach(r=>{if(r.fill===fid&&r._oos&&r._oos.length&&!(r._sig&&r._sig.verified))unv.push(T.tanktemp.th)});
    if(unv.length)b.push('มีบันทึกผิดเกณฑ์ที่ยังไม่ได้ทวนสอบ: '+[...new Set(unv)].join(', '))}
  return [...new Set(b)]}
function pestOrchard(p){if(p.orchard)return p.orchard;const l=byId('receiving',p.lot);const h=l&&byId('harvest',l.harvest);return h?h.orchard:''}
function pestStatus(oid,at){const N=lim('pestValidDays')??30;const d=String(at||today()).slice(0,10);const from=addDays(d,-N);
  const list=recs('pesticide').filter(p=>pestOrchard(p)===oid&&(p.date||'')<=d).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const okp=list.find(p=>p.result==='ผ่าน'&&(p.date||'')>=from);const last=list[0];
  return {ok:!!okp,text:okp?'ผ่าน ('+fD(okp.date)+')':last?last.result+' ('+fD(last.date)+') — ไม่มีผลผ่านภายใน '+N+' วัน':'ยังไม่มีผลของสวนนี้'}}
/* ---- R3 stock double entry (auto, linked by _src) ---- */
function upsertStock(src,key,obj,msg){const ex=recs('stock',true).find(s=>s._src===src&&s._srcKey===key);
  if(ex){const old=JSON.parse(JSON.stringify(ex));let ch=!!ex._void;if(ex._void)delete ex._void;Object.keys(obj).forEach(k=>{if(ex[k]!==obj[k]){ex[k]=obj[k];ch=true}});
    if(ch){derive('stock',ex);logAuto('stock',ex,msg+' (อัปเดต)',old)}return ex}
  const r=autoCreate('stock',obj,msg);r._src=src;r._srcKey=key;r._auto=true;return r}

/* ---- audit trail (append-only, hash-chained) ---- */
let auditQ=Promise.resolve();
function auditPayload(e){return JSON.stringify([e.seq,e.at,e.uid,e.user,e.action,e.type,e.rid,e.label,e.diff,e.reason,e.prev])}
function diffOf(t,old,r){const out=[];T[t].fields.forEach(f=>{if(f.t==='auto')return;const a=old?plain(f,old[f.k]):'',b=r?plain(f,r[f.k]):'';if(a!==b)out.push([f.l,a,b])});return out}
function audit(action,t,r,old,reason,withDiff){
  const e={at:stamp(),uid:ME?ME.id:'system',user:ME?ME.name:'ระบบ',role:ME?ME.role:'',action,type:t||'',rid:r?r._id:'',label:r&&t?lbl(t,r):'',
    diff:t&&r&&(old||withDiff)?diffOf(t,old,r):[],reason:reason||''};
  auditQ=auditQ.then(async()=>{const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:'GENESIS';e.seq=DB.audit.length+1;e.prev=prev;e.hash=await sha(auditPayload(e));DB.audit.push(e)}).catch(console.error);
  markDirty();if(typeof cloudMark==='function')cloudMark(action,t,r);return auditQ}
async function verifyChain(){await auditQ;let prev='GENESIS';for(const e of DB.audit){if(e.prev!==prev)return e.seq;if(await sha(auditPayload(e))!==e.hash)return e.seq;prev=e.hash}return 0}
function logAuto(t,r,msg,old){return audit('อัตโนมัติ',t,r,old||null,msg)}

/* ---- create / edit ---- */
function stampNew(t,r){r._id=r._id||uid();r._created=stamp();r._by=ME?ME.id:'';r._sig=r._sig||{}}
function autoCreate(t,obj,msg){const r=Object.assign(newRec(t),obj);stampNew(t,r);genIds(t,r);derive(t,r);r._oos=oosOf(t,r).map(x=>x.msg);
  recs(t,true).push(r);audit('อัตโนมัติ: สร้าง',t,r,null,msg,true);return r}
async function commit(t,r,old,reason,opt={}){const o=T[t];
  if(!old)stampNew(t,r);genIds(t,r);derive(t,r);r._oos=oosOf(t,r).map(x=>x.msg);
  if(old){r._updated=stamp();r._updBy=ME.id;const had=['verified','approved'].filter(m=>r._sig&&r._sig[m]);
    if(had.length){had.forEach(m=>delete r._sig[m]);if(o.onUnsign)o.onUnsign(r);reason=(reason||'')+' [ล้างลายเซ็น '+had.map(m=>MEANS[m]).join('/')+' เพราะแก้ไขหลังลงนาม]'}
    const arr=recs(t,true);arr[arr.findIndex(x=>x._id===r._id)]=r}
  else recs(t,true).push(r);
  audit(old?'แก้ไข':(opt.action||'สร้าง'),t,r,old,reason,!old);
  if(o.after&&!opt.noAuto)o.after(r,old);
  if(DB.settings.rules.autoNC&&r._oos.length&&!(old&&old._oos&&old._oos.length)&&!opt.noAuto&&o.nc!==0)autoNC(t,r);
  markDirty();return r}
function autoNC(t,r){const o=T[t];let lot='',batch='',fill='';
  if(t==='receiving')lot=r._id;else if(['holding','pesticide'].includes(t))lot=r.lot;else if(['washing','striking','filtration'].includes(t))batch=r.batch;
  else if(t==='tankfill')fill=r._id;else if(t==='tanktemp')fill=r.fill;else if(t==='labtest'){lot=r.lot||'';batch=r.batch||'';fill=r.fill||''}
  else if(t==='dispatch'){const rl=byId('release',r.release);fill=rl?rl.fill:''}else if(t==='external')fill=r.fill||'';
  const txt=r._oos.join(' ');const reason=/อุณหภูมิ/.test(txt)?'อุณหภูมิเกิน':/Brix/.test(txt)?'Brix ผิดปกติ (糖度波动)':/TPC|Coli|Yeast|จุลินทรีย์/.test(txt)?'จุลินทรีย์เกิน (微生物超标)':
    /อายุการพัก|เวลา/.test(txt)?'เกินเวลาพัก':/กลิ่น|ประสาท|หมัก/.test(txt)?'กลิ่นรสผิดปกติ (香水椰风味异常)':/สาร|ตกค้าง/.test(txt)?'สารตกค้าง':'อื่นๆ';
  const src=o.th+' '+lbl(t,r);
  if(lot||batch||fill){const n=autoCreate('nc',{source:t==='receiving'?'ตรวจรับวัตถุดิบ':t==='labtest'||t==='external'?'ผลแล็บ':'OOS ในกระบวนการ',
      mtype:fill?'น้ำในถัง':'มะพร้าววัตถุดิบ',lot,batch,fill,reason,srcRef:src,detail:r._oos.join('\n')+(r.immAction?'\nการแก้ไขทันที: '+r.immAction:'')},'สร้าง NC อัตโนมัติจากผิดเกณฑ์ ('+src+')');
    setTimeout(()=>toast('ผิดเกณฑ์ — สร้าง '+n.ncId+' และกักสินค้าที่เกี่ยวข้องอัตโนมัติ','bad'),400)}
  else{const c=autoCreate('capa',{source:'OOS',srcRef:src,desc:r._oos.join('\n')+(r.immAction?'\nการแก้ไขทันที: '+r.immAction:''),correction:r.immAction||'',due:addDays(today(),14)},'สร้าง CAPA อัตโนมัติจากผิดเกณฑ์ ('+src+')');
    setTimeout(()=>toast('ผิดเกณฑ์ — สร้าง '+c.capaId+' อัตโนมัติ','bad'),400)}}

function canSign(t,r,m){if(!ME)return 'ยังไม่เข้าสู่ระบบ';if(ME.role==='auditor')return 'Auditor ลงนามไม่ได้';if(r._void)return 'บันทึกถูกยกเลิกแล้ว';
  if(r._sig&&r._sig[m])return 'ลงนามแล้ว';
  if(m==='verified'&&!CAN.verify.includes(ME.role))return 'บทบาทนี้ทวนสอบไม่ได้';
  if(m==='approved'&&!CAN.approve.includes(ME.role))return 'ต้องเป็น QA Manager หรือ Food Safety Director';
  if(m!=='performed'&&DB.settings.rules.segregation){const p=r._sig&&r._sig.performed;if(p&&p.uid===ME.id)return 'ผู้บันทึกลงนามทวนสอบ/อนุมัติบันทึกของตนเองไม่ได้ (แยกหน้าที่)';
    if(m==='approved'){const v=r._sig&&r._sig.verified;if(v&&v.uid===ME.id)return 'ผู้ทวนสอบอนุมัติซ้ำไม่ได้'}}
  if(m==='approved'&&T[t].sign.includes('verified')&&!(r._sig&&r._sig.verified))return 'ต้องทวนสอบก่อนอนุมัติ';
  return true}

/* ---------- values ---------- */
function fmtCell(t,f,v,r){if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';const o=T[t];
  if(f.t==='id'||f.k===o.idf)return `<span class="lot">${esc(v)}</span>`;
  switch(f.t){
   case 'ref':{const x=byId(f.rt,v);if(!x)return '<span class="muted">(ไม่พบ)</span>';const s=lbl(f.rt,x);return T[f.rt].idf?`<span class="lot">${esc(s)}</span>`:esc(s)}
   case 'refq':return v.map(q=>`<span class="lot">${esc(lblId(f.rt,q.id))}</span> ${nf(q.q)}`).join('<br>');
   case 'refm':return esc(v.map(id=>lblId(f.rt,id)).join(', '));
   case 'multi':return esc(v.join(', '));
   case 'chk':return v?'<span class="x-ok">✓</span>':(f.must?'<span class="x-bad">✗</span>':'—');
   case 'user':return esc(userName(v));
   case 'date':{const s=fD(v);if((o.exp||[]).some(e=>e[0]===f.k)){const d=daysTo(v);if(d<0)return `<span class="st bad">${s}</span>`;if(d<=lim('alertDays1'))return `<span class="st warn">${s}</span>`}return s}
   case 'dt':return fDT(v);
   case 'num':return `<span class="n">${nf(v)}</span>`;
   case 'area':return '<span data-notr>'+esc(String(v).length>80?String(v).slice(0,80)+'…':v).replace(/\n/g,'<br>')+'</span>';
   case 'text':return '<span data-notr>'+esc(v)+'</span>';
   default:{const c=STATUSF.has(f.k)||f.t==='sel'?stCls(v):'';const s=esc(v).replace(/\n/g,'<br>');return c?`<span class="st ${c}">${s}</span>`:s}}}
function sigBadges(t,r){return T[t].sign.map(m=>`<span class="sg ${r._sig&&r._sig[m]?'on':''}" title="${MEAN[m]}${r._sig&&r._sig[m]?': '+esc(r._sig[m].name)+' '+r._sig[m].at:''}">${MEANS[m]}</span>`).join('')}
function rowText(t,r){return T[t].fields.map(f=>plain(f,r[f.k])).join(' ')}

   <button class="btn" onclick="exportXlsx('${t}')">ส่งออก Excel</button></div>
  <div class="bar"><input class="q" type="search" placeholder="ค้นหาในทุกช่อง เช่น lot, ชื่อ, ผล" value="${esc(fl.q)}" oninput="UI.flt['${t}'].q=this.value;$('#lt').innerHTML=listTable('${t}')" aria-label="ค้นหา">
   ${o.date?`<label class="small muted">จาก</label><input type="date" value="${fl.from}" onchange="UI.flt['${t}'].from=this.value;$('#lt').innerHTML=listTable('${t}')"><label class="small muted">ถึง</label><input type="date" value="${fl.to}" onchange="UI.flt['${t}'].to=this.value;$('#lt').innerHTML=listTable('${t}')">`:''}
   <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${fl.void?'checked':''} onchange="UI.flt['${t}'].void=this.checked;$('#lt').innerHTML=listTable('${t}')">แสดงที่ยกเลิก</label></div>
  <div id="lt">${listTable(t)}</div>`}
function listRows(t){const o=T[t];const fl=UI.flt[t]||{};let rows=recs(t,true).filter(r=>fl.void||!r._void);
  if(o.date){const d=r=>String(r[o.date]||'').slice(0,10);if(fl.from)rows=rows.filter(r=>d(r)>=fl.from);if(fl.to)rows=rows.filter(r=>d(r)<=fl.to);
    rows.sort((a,b)=>String(b[o.date]||'').localeCompare(String(a[o.date]||''))||String(b._created||'').localeCompare(String(a._created||'')))}
  else rows.sort((a,b)=>lbl(t,a).localeCompare(lbl(t,b),'th'));
  if(fl.q){const q=fl.q.toLowerCase();rows=rows.filter(r=>rowText(t,derived(t,r)).toLowerCase().includes(q))}return rows}
function listTable(t){const o=T[t];const rows=listRows(t);const cols=o.cols.map(k=>o.fmap[k]).filter(Boolean);
  if(!rows.length)return `<div class="tw"><div class="empty"><b>ยังไม่มีบันทึก${UI.flt[t]&&UI.flt[t].q?'ที่ตรงกับคำค้น':''}</b>${canWrite()?'กด "บันทึกใหม่" เพื่อเริ่ม หรือนำเข้าจาก Excel ที่เมนู นำเข้า / ส่งออก':''}</div></div>`;
  return `<div class="small muted" style="margin-bottom:6px">${rows.length} รายการ</div><div class="tw"><table class="tbl"><thead><tr>${cols.map(f=>`<th>${esc(f.l.replace(/\s*\((อัตโนมัติ|ลิตร, อัตโนมัติ|ชม\., อัตโนมัติ|ลูก, อัตโนมัติ)\)/,''))}</th>`).join('')}<th>ลงนาม</th></tr></thead><tbody>
   ${rows.map(r0=>{const r=derived(t,r0);return `<tr class="click ${r0._oos&&r0._oos.length?'oos':''} ${r0._void?'void':''}" onclick="openDetail('${t}','${r0._id}')" tabindex="0" onkeydown="if(event.key==='Enter')openDetail('${t}','${r0._id}')">${cols.map(f=>`<td>${fmtCell(t,f,r[f.k],r)}</td>`).join('')}<td style="white-space:nowrap">${sigBadges(t,r0)}${r0._oos&&r0._oos.length?' <span class="st bad">OOS '+r0._oos.length+'</span>':''}</td></tr>`}).join('')}</tbody></table></div>`}

   ${r0._oos&&r0._oos.length?`<div class="banner bad">ผิดเกณฑ์ (OOS): ${r0._oos.map(esc).join(' · ')}</div>`:''}
   <dl class="kv">${o.fields.filter(f=>!(f.oosOnly&&!r.immAction)).map(f=>`<dt>${esc(f.l)}</dt><dd>${fmtCell(t,f,r[f.k],r)||'<span class="muted">—</span>'}</dd>`).join('')}
   <dt>สร้างเมื่อ</dt><dd>${esc(r0._created||'')} โดย ${esc(userName(r0._by))}</dd>${r0._updated?`<dt>แก้ไขล่าสุด</dt><dd>${esc(r0._updated)} โดย ${esc(userName(r0._updBy))}</dd>`:''}</dl>
   <h3 style="margin:18px 0 8px">ลายมือชื่ออิเล็กทรอนิกส์</h3>
   <div class="tw"><table class="tbl"><tbody>${o.sign.map(m=>{const s=r0._sig&&r0._sig[m];return `<tr><td>${MEAN[m]}</td><td>${s?`<span class="x-ok">✓</span> ${esc(s.name)} <span class="muted small">(${esc(ROLES[s.role]||s.role)})</span>`:'<span class="muted">ยังไม่ลงนาม</span>'}</td><td class="small muted">${s?esc(s.at):''}</td></tr>`}).join('')}</tbody></table></div>
   <h3 style="margin:18px 0 8px">ประวัติการเปลี่ยนแปลง (Audit trail)</h3>
   ${hist.length?`<div class="tw"><table class="tbl"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด / เหตุผล</th></tr></thead><tbody>${hist.map(e=>`<tr><td class="small">${esc(e.at)}</td><td>${esc(e.user)}</td><td>${esc(e.action)}</td><td class="small">${diffHtml(e)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ไม่มีประวัติ</p>'}`;
  const acts=(o.actions||[]).map(a=>`<button class="btn" onclick="${a.fn}('${t}','${id}')">${esc(a.l)}</button>`).join('');
  const foot=`<div class="left">${!r0._void&&canWrite()?`<button class="btn d" onclick="openVoid('${t}','${id}')">ยกเลิกบันทึก</button>`:''}</div>
   ${acts}<button class="btn" onclick="printRecord('${t}','${id}')">พิมพ์ A4</button>
   ${!r0._void&&pend.length&&canWrite()?`<button class="btn" onclick="openSign('${t}','${id}')">ลงนาม</button>`:''}
   ${!r0._void&&canWrite()?`<button class="btn p" onclick="openForm('${t}','${id}')">แก้ไข</button>`:''}`;
  modal(`${esc(o.th)} <span class="lot">${esc(lbl(t,r0))}</span>`,body,foot,'',o.zh)}
function diffHtml(e){const d=(e.diff||[]).slice(0,12).map(([l,a,b])=>`<div><b>${esc(l)}</b>: ${a?`<s class="muted">${esc(a)}</s> → `:''}${esc(b)}</div>`).join('');
  return d+((e.diff||[]).length>12?'<div class="muted">… อีก '+(e.diff.length-12)+' ช่อง</div>':'')+(e.reason?`<div class="muted">เหตุผล: ${esc(e.reason)}</div>`:'')}

/* ---------- form ---------- */
function refOpts(f,r){const cur=f.t==='refq'?(r[f.k]||[]).map(q=>q.id):f.t==='refm'?(r[f.k]||[]):[r[f.k]];
  const o=T[f.rt];let list=recs(f.rt).filter(x=>cur.includes(x._id)||!f.flt||(()=>{try{return f.flt(x,r)}catch(e){return false}})());
  if(o.date)list.sort((a,b)=>String(b[o.date]||'').localeCompare(String(a[o.date]||'')));else list.sort((a,b)=>lbl(f.rt,a).localeCompare(lbl(f.rt,b),'th'));return list}
function optText(rt,x){let s=lbl(rt,x);if(T[rt].info){try{const i=T[rt].info(x);if(i&&i!==s)s+=' — '+i}catch(e){}}return s}
function dlValues(t,k){return [...new Set(recs(t).map(r=>r[k]).filter(v=>v&&typeof v==='string'))].slice(0,60)}
function fieldHTML(t,f,r){const v=r[f.k];const k=f.k;const id='f_'+k;let inp='';const req=f.req?' <span class="req">*</span>':'';
  switch(f.t){
   case 'id':inp=f.edit?`<input id="${id}" name="${k}" value="${esc(v||'')}" placeholder="สร้างอัตโนมัติเมื่อบันทึก">`:`<output class="auto" data-k="${k}">${esc(v||'สร้างอัตโนมัติเมื่อบันทึก')}</output>`;break;
   case 'text':inp=`<input id="${id}" name="${k}" value="${esc(v??'')}" ${f.dl?`list="dl_${k}"`:''} autocomplete="off">${f.dl?`<datalist id="dl_${k}">${dlValues(t,k).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;break;
   case 'area':inp=`<textarea id="${id}" name="${k}">${esc(v??'')}</textarea>`;break;
   case 'num':inp=`<input id="${id}" name="${k}" type="number" step="any" inputmode="decimal" value="${v===''||v==null?'':esc(v)}">`;break;
   case 'date':inp=`<input id="${id}" name="${k}" type="date" value="${esc(v||'')}">`;break;
   case 'dt':inp=`<input id="${id}" name="${k}" type="datetime-local" value="${esc(v||'')}">`;break;
   case 'sel':{const o=typeof f.o==='function'?f.o(r):f.o;const has=o.includes(v);inp=`<select id="${id}" name="${k}"><option value="">— เลือก —</option>${o.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!has?`<option value="${esc(v)}" selected>${esc(v)}</option>`:''}</select>`;break}
   case 'user':inp=`<select id="${id}" name="${k}"><option value="">— เลือก —</option>${usersOpt().map(u=>`<option value="${u.id}" ${u.id===v?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`;break;
   case 'chk':return `<div class="fld ${f.w?'w':''}" data-f="${k}"><label class="tg" for="${id}"><input type="checkbox" id="${id}" name="${k}" ${v?'checked':''}><span>${esc(f.l)}</span></label><div class="oosmsg"></div>${hintOf(f)}</div>`;
   case 'multi':{const o=typeof f.o==='function'?f.o(r):f.o;inp=`<div class="mc" data-k="${k}">${o.map(x=>`<label><input type="checkbox" value="${esc(x)}" ${(v||[]).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>`;break}
   case 'ref':inp=`<select id="${id}" name="${k}"><option value="">— เลือก —</option>${refOpts(f,r).map(x=>`<option value="${x._id}" ${x._id===v?'selected':''}>${esc(optText(f.rt,x))}</option>`).join('')}</select>`;break;
   case 'refm':{const ops=refOpts(f,r);inp=ops.length?`<div class="rl" data-k="${k}">${ops.map(x=>`<label><input type="checkbox" value="${x._id}" ${(v||[]).includes(x._id)?'checked':''}>${esc(optText(f.rt,x))}</label>`).join('')}</div>`:`<div class="muted small">ยังไม่มี ${esc(T[f.rt].th)}</div>`;break}
   case 'refq':{const rows=(v&&v.length?v:[{id:'',q:''}]);inp=`<div class="rq" data-k="${k}" data-rt="${f.rt}">${rows.map(q=>rqRow(f,r,q)).join('')}</div><button type="button" class="btn s" style="margin-top:6px" onclick="rqAdd('${k}')">+ เพิ่มรายการ</button>`;break}
   case 'auto':inp=`<output class="auto" data-k="${k}"></output>`;break}
  return `<div class="fld ${f.w?'w':''} ${f.oosOnly?'oosonly':''}" data-f="${k}"><label for="${id}">${esc(f.l)}${req}</label>${inp}<div class="oosmsg"></div>${hintOf(f)}</div>`}
const hintOf=f=>{const h=typeof f.h==='function'?f.h():f.h;return h?`<div class="hint">${esc(h)}</div>`:''};
function rqRow(f,r,q){return `<div class="r"><select aria-label="เลือก"><option value="">— เลือก —</option>${refOpts(f,r).map(x=>`<option value="${x._id}" ${x._id===q.id?'selected':''}>${esc(optText(f.rt,x))}</option>`).join('')}</select><input type="number" step="any" inputmode="decimal" placeholder="${esc(f.unit||'จำนวน')}" value="${q.q===''||q.q==null?'':esc(q.q)}" aria-label="จำนวน"><button type="button" class="btn" onclick="this.parentNode.remove();liveForm()" aria-label="ลบ">✕</button></div>`}
function rqAdd(k){const {t}=UI.form;const f=T[t].fmap[k];const r=readForm();const box=$(`.rq[data-k="${k}"]`);box.insertAdjacentHTML('beforeend',rqRow(f,r,{id:'',q:''}));liveForm()}
function openForm(t,id,preset){if(!canWrite())return toast('บทบาท Auditor ดูข้อมูลได้อย่างเดียว','bad');const o=T[t];const old=id?byId(t,id):null;
  if(old&&old._void)return toast('บันทึกที่ยกเลิกแล้วแก้ไขไม่ได้','bad');
  if(old&&old._auto)return toast('บันทึกนี้ระบบสร้างอัตโนมัติ — แก้ไขที่บันทึกต้นทาง ('+(old.refDoc||'')+')','bad');
  const r=old?JSON.parse(JSON.stringify(old)):newRec(t,preset);derive(t,r);
  const signable=!old&&o.sign.includes('performed')&&DB.settings.rules.signOnSave;
  modal((old?'แก้ไข: ':'บันทึกใหม่: ')+esc(o.th)+(old?` <span class="lot">${esc(lbl(t,old))}</span>`:''),
   `<div id="frmErr" class="banner bad hide" role="alert"></div><div id="oosBanner" class="banner bad hide"></div>
    <form id="frm" class="fg" onsubmit="return false" oninput="liveForm()" onchange="liveForm()">${o.fields.map(f=>fieldHTML(t,f,r)).join('')}</form>`,
   `<div class="left">${old?`<input id="frmReason" placeholder="เหตุผลการแก้ไข (จำเป็น)" style="min-width:260px" aria-label="เหตุผลการแก้ไข">`:
     signable?`<label class="signrow small"><input type="checkbox" id="frmSign" ${o.ccp?'checked':''} onchange="$('#frmPin').disabled=!this.checked">ลงนามผู้บันทึกทันที</label><input id="frmPin" type="password" inputmode="numeric" placeholder="PIN" style="width:110px;min-height:38px;height:38px" ${o.ccp?'':'disabled'} aria-label="PIN สำหรับลงนาม">`:''}</div>
    ${(o.formActions||[]).map(a=>`<button class="btn" onclick="${a.fn}()">${esc(a.l)}</button>`).join('')}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="saveForm()">บันทึก</button>`,'',o.zh);
  UI.form={t,id,base:r};liveForm();setTimeout(()=>{const x=$('#frm input:not([type=checkbox]),#frm select');if(x)x.focus()},60)}
function readForm(){const {t,base}=UI.form;const o=T[t];const r=JSON.parse(JSON.stringify(base));const fm=$('#frm');if(!fm)return r;
  o.fields.forEach(f=>{const k=f.k;if(f.t==='auto')return;
   if(f.t==='id'){if(f.edit){const el=fm.elements[k];if(el)r[k]=el.value.trim()}return}
   if(f.t==='multi'||f.t==='refm'){const box=$(`[data-k="${k}"]`,fm);if(box)r[k]=$$('input[type=checkbox]:checked',box).map(x=>x.value);return}
   if(f.t==='chk'){const el=fm.elements[k];r[k]=!!(el&&el.checked);return}
   if(f.t==='refq'){r[k]=$$(`.rq[data-k="${k}"] .r`,fm).map(row=>({id:$('select',row).value,q:$('input',row).value===''?'':+$('input',row).value})).filter(x=>x.id);return}
   const el=fm.elements[k];if(!el)return;let v=el.value;if(f.t==='num')v=v===''?'':Number(v);r[k]=v});return r}
function liveForm(){if(!UI.form)return;const {t}=UI.form;const r=readForm();derive(t,r);if(T[t].live&&T[t].live(r))return liveForm();

const CHAIN=[['orchard',null,'สวน'],['harvest','orchard','เก็บเกี่ยว'],['receiving','harvest','Lot วัตถุดิบ'],['input','lots','Batch ผลิต'],['tankfill','batches','ถังพัก'],['release','fill','ปล่อยสินค้า'],['dispatch','release','ส่งออก'],['sales','dispatch','ลูกค้า']];
const CI=Object.fromEntries(CHAIN.map((c,i)=>[c[0],i]));
function parentIds(t,r){const c=CHAIN[CI[t]];if(!c||!c[1])return [];const v=r[c[1]];return Array.isArray(v)?v.map(q=>q.id||q):v?[v]:[]}
function childRecs(t,id){const i=CI[t];if(i==null||i>=CHAIN.length-1)return [];const ct=CHAIN[i+1][0];return recs(ct).filter(r=>parentIds(ct,r).includes(id))}
let RELATED=null;
function related(){if(RELATED)return RELATED;RELATED=[];ORDER.forEach(t=>{if(CI[t]!=null||t==='nc')return;T[t].fields.forEach(f=>{if(f.t==='ref'&&CI[f.rt]!=null)RELATED.push({t,k:f.k,rt:f.rt})})});
  RELATED.push({t:'nc',k:'lot',rt:'receiving'},{t:'nc',k:'batch',rt:'input'},{t:'nc',k:'fill',rt:'tankfill'});return RELATED}
function relOf(rt,id){const out={};related().filter(x=>x.rt===rt).forEach(x=>{const list=recs(x.t).filter(r=>r[x.k]===id);if(list.length)(out[x.t]=out[x.t]||[]).push(...list)});return out}
function traceCodes(){const s=[];CHAIN.forEach(([t])=>recs(t).forEach(r=>{const l=lbl(t,r);if(l)s.push(l)}));recs('dispatch').forEach(d=>d.seal&&s.push(d.seal));recs('sales').forEach(d=>d.invoice&&s.push(d.invoice));return [...new Set(s)]}
function findNode(code){const c=String(code||'').trim().toLowerCase();if(!c)return null;for(const [t] of CHAIN){const r=recs(t).find(x=>lbl(t,x).toLowerCase()===c||(t==='dispatch'&&String(x.seal||'').toLowerCase()===c)||(t==='sales'&&String(x.invoice||'').toLowerCase()===c));if(r)return {t,r}}return null}
function traceRun(code,mode){const s=findNode(code);if(!s)return null;const nodes=new Map();const add=(t,r)=>nodes.set(r._id,{t,r});add(s.t,s.r);
  if(mode!=='fwd'){const up=(t,r)=>{const i=CI[t];if(!i)return;const pt=CHAIN[i-1][0];parentIds(t,r).forEach(id=>{const p=byId(pt,id);if(p&&!nodes.has(id)){add(pt,p);up(pt,p)}})};up(s.t,s.r)}
  if(mode!=='back'){const down=(t,r)=>{childRecs(t,r._id).forEach(c=>{const ct=CHAIN[CI[t]+1][0];if(!nodes.has(c._id)){add(ct,c);down(ct,c)}})};down(s.t,s.r)}
  return {start:s,mode,nodes:[...nodes.values()],at:stamp()}}
function massBalance(res){const out=[];res.nodes.forEach(({t,r})=>{
  if(t==='receiving'){const nc=sum(ncFor(r._id).filter(n=>/ทำลาย|คืน/.test(n.disposition||'')).map(n=>n.qty));const iss=lotIssued(r._id);const rec=+r.qty||0;const rej=+r.rejQty||0;const rem=rec-rej-iss;
    out.push({t,label:r.lotId,unit:'ลูก',total:rec,parts:[['คัดทิ้งตอนรับ',rej],['เข้าผลิต',iss],['NC ทำลาย/คืน',nc],['คงเหลือ',rem-nc]]})}
  if(t==='tankfill'){const vol=fillVol(r);const disp=fillDispatched(r._id);const nc=sum(ncFor(r._id).filter(n=>/ทำลาย|คืน/.test(n.disposition||'')).map(n=>n.qty));
    const ret=sum(recs('retain').filter(x=>x.fill===r._id).map(x=>(+x.qty||0)/1000));const rem=vol-disp-nc-ret;
    out.push({t,label:r.fillId,unit:'ลิตร',total:vol,parts:[['ส่งลูกค้า',disp],['เก็บตัวอย่าง',Math.round(ret*100)/100],['NC ทำลาย/คืน',nc],[r.closed?'ปิดถัง (คงค้าง)':'คงเหลือในถัง',Math.round(rem*100)/100]]})}});return out}
function mbPct(mb){const tot=sum(mb.map(m=>m.total));if(!tot)return '';const acc=sum(mb.map(m=>sum(m.parts.filter(p=>p[1]>=0).map(p=>p[1]))));return Math.round(Math.min(acc,tot)/tot*1000)/10}

const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,'').replace(/[()（）:：.\-_/]/g,'');
function guessType(name){const n=String(name);const k=n.split('_')[0];if(T[k])return k;const nn=norm(n);

function mapCols(t,head){const fs=xFields(t);return head.map(h=>{const s=String(h||'');const m=s.match(/\[([A-Za-z0-9_]+)\]/);if(m&&T[t].fmap[m[1]])return m[1];

function parseDate(v,withTime){if(v instanceof Date&&!isNaN(v))return withTime?isoDT(v):isoD(v);const s=String(v||'').trim();if(!s)return '';
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;const d=new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));return withTime?isoDT(d):isoD(d)}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);if(m){let y=+m[1];if(y>2400)y-=543;const d=new Date(y,+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));return withTime?isoDT(d):isoD(d)}
  if(!isNaN(+s)&&+s>20000&&+s<80000){const d=new Date(Math.round((+s-25569)*864e5));d.setMinutes(d.getMinutes()+d.getTimezoneOffset());return withTime?isoDT(d):isoD(d)}return ''}

function convVal(f,v){if(v==null||v==='')return f.t==='chk'?false:['multi','refm','refq'].includes(f.t)?[]:'';switch(f.t){
  case 'num':{const n=Number(String(v).replace(/,/g,''));return isNaN(n)?'':n}
  case 'date':return parseDate(v,false);case 'dt':return parseDate(v,true);
  case 'chk':return /^(ใช่|是|y|yes|true|1|✓|x|ผ่าน|合格)$/i.test(String(v).trim());
  case 'multi':return String(v).split(/[;,；，]/).map(s=>canonOpt(f,s.trim())).filter(Boolean);
  case 'sel':return canonOpt(f,String(v).trim());
  case 'ref':return findByLabel(f.rt,v);case 'refm':return String(v).split(/[;,]/).map(s=>findByLabel(f.rt,s)).filter(Boolean);
  case 'refq':return String(v).split(/;/).map(p=>{const [a,b]=p.split(':');return {id:findByLabel(f.rt,a),q:+b||0}}).filter(q=>q.id);
  case 'user':{const u=DB.users.find(u=>u.name===String(v).trim());return u?u.id:''}
  default:return v instanceof Date?isoD(v):String(v)}}
function canonOpt(f,v){if(!v)return v;let o=[];try{o=typeof f.o==='function'?f.o({}):(f.o||[])}catch(e){}return o.find(x=>x===v||toZh(x)===v)||v}

async function addUser(){const n=$('#nuName').value.trim(),r=$('#nuRole').value,p=$('#nuPin').value.trim();if(!n)return toast('ใส่ชื่อ','bad');if(usePin()&&!/^\d{4,8}$/.test(p))return toast('PIN 4–8 หลัก','bad');
  if(DB.users.some(u=>u.name===n))return toast('ชื่อซ้ำ','bad');const id=uid();DB.users.push({id,name:n,role:r,pinHash:await sha(id+':'+p),mustChange:true,active:true});
  audit('เพิ่มผู้ใช้','',null,null,n+' ('+ROLES[r]+')');toast('เพิ่ม '+n+' แล้ว — PIN เริ่มต้น '+p,'ok');render()}
function setRole(id,r){const u=DB.users.find(x=>x.id===id);const old=u.role;if(u.id===ME.id&&r!=='admin'&&!DB.users.some(x=>x.id!==id&&x.role==='admin'&&x.active!==false)){toast('ต้องมี Admin อย่างน้อย 1 คน','bad');render();return}
  u.role=r;audit('เปลี่ยนบทบาท','',null,null,u.name+': '+ROLES[old]+' → '+ROLES[r]);render()}
async function resetPin(id){const u=DB.users.find(x=>x.id===id);const p=String(Math.floor(1000+Math.random()*9000));u.pinHash=await sha(u.id+':'+p);u.mustChange=true;audit('รีเซ็ต PIN','',null,null,u.name);
  modal('รีเซ็ต PIN แล้ว',`<p>PIN ใหม่ของ <b>${esc(u.name)}</b> คือ</p><p class="score">${p}</p><p class="small muted">แจ้งผู้ใช้โดยตรง ระบบจะบังคับให้เปลี่ยนเมื่อเข้าสู่ระบบ</p>`,`<button class="btn p" onclick="closeModal()">ปิด</button>`,'narrow')}
function toggleUser(id){const u=DB.users.find(x=>x.id===id);u.active=u.active===false;audit(u.active?'เปิดใช้งานผู้ใช้':'ปิดใช้งานผู้ใช้','',null,null,u.name);render()}
function saveSettings(){const S=DB.settings;const ch=[];const set=(k,v)=>{if(JSON.stringify(S[k])!==JSON.stringify(v)){ch.push(k+': '+JSON.stringify(S[k])+' → '+JSON.stringify(v));S[k]=v}};
  ['company','companyEn','companyZh','plant','formCode','auditFrom','auditTo'].forEach(k=>set(k,$('#s_'+k).value.trim()));
  ['tanks','lines','filters','zones','envZones'].forEach(k=>set(k,$('#s_'+k).value.split(',').map(x=>x.trim()).filter(Boolean)));
  LIM.forEach(([k,l])=>{const v=$('#L_'+k).value;const n=v===''?'':+v;if(S.limits[k]!==n){ch.push(l+': '+S.limits[k]+' → '+n);S.limits[k]=n}});
  Object.keys(S.rules).forEach(k=>{if(k==='tankBatchMode')return;const el=$('#R_'+k);if(el&&S.rules[k]!==el.checked){ch.push('กฎ '+k+': '+S.rules[k]+' → '+el.checked);S.rules[k]=el.checked}});
  {const v=$('#R_tankBatchMode').value;if(S.rules.tankBatchMode!==v){ch.push('กฎถัง: '+S.rules.tankBatchMode+' → '+v);S.rules.tankBatchMode=v}}
  if(ch.length){audit('แก้ไขตั้งค่า','',null,null,ch.join(' | '));toast('บันทึกการตั้งค่าแล้ว ('+ch.length+' รายการ)','ok')}else toast('ไม่มีการเปลี่ยนแปลง');render()}
async function resetAll(){if(CL.on)return toast('ตัดการเชื่อมต่อ Cloud ก่อน แล้วจึงเริ่มไฟล์ใหม่ (ข้อมูลใน Cloud จะไม่ถูกลบ)','bad');if(!confirm('ล้างข้อมูลทั้งหมดและเริ่มไฟล์ใหม่? (ควรบันทึกไฟล์สำรองก่อน)'))return;const w=prompt('พิมพ์คำว่า ล้างข้อมูล เพื่อยืนยัน');if(w!=='ล้างข้อมูล'&&w!==toZh('ล้างข้อมูล'))return;

<h3>1. เริ่มต้นใช้งาน</h3><ol>
<li>เปิดไฟล์ <code>FSMS_Coconut_v1.3.0.html</code> ด้วย Chrome หรือ Edge (แนะนำ เพราะบันทึกทับไฟล์เดิมได้)</li>
<li>ไม่มีหน้าเข้าสู่ระบบ: เปิดไฟล์แล้วใช้งานได้ทันทีในชื่อผู้ใช้คนล่าสุดของเครื่อง ครั้งแรกเป็น <b>ผู้ดูแลระบบ (PIN 1234)</b> และระบบให้ตั้ง PIN ใหม่ทันที · เปลี่ยนคนใช้: กดชื่อที่มุมขวาบน → สลับผู้ใช้ → ใส่ PIN</li>
<li>ไปที่ <b>ตั้งค่า</b> แก้ชื่อบริษัท ถัง ไลน์ ชั้นกรอง และ <b>เกณฑ์ทุกข้อให้ตรงกับ HACCP Plan</b> (ค่าเริ่มต้นเป็นค่าตัวอย่าง)</li>
<li>เพิ่มผู้ใช้ทุกคนที่บันทึกหรือลงนาม พร้อมบทบาท ห้ามใช้บัญชีร่วมกัน</li>
<li>กด <b>บันทึก</b> เพื่อสร้างไฟล์ข้อมูล (.json เข้ารหัส) ครั้งต่อไปกด "บันทึก" จะเขียนทับไฟล์เดิม</li>
<li>อยากลองระบบก่อน: ตั้งค่า → <b>ใส่ข้อมูลตัวอย่าง</b> (ลบได้ด้วย "เริ่มไฟล์ข้อมูลใหม่")</li><li>สลับภาษา <b>ไทย / 中文</b> ได้ที่มุมขวาบน ระบบจำภาษาของผู้ใช้แต่ละคน</li></ol>
<h3>2. การบันทึกและเปิดไฟล์</h3><ul>
<li>ไฟล์ข้อมูลเข้ารหัส AES-256-GCM ด้วยกุญแจที่ฝังในโปรแกรม จึง<b>ไม่ต้องใส่รหัสผ่านทุกครั้ง</b> และเปิดอ่านด้วยโปรแกรมอื่นไม่ได้</li>
<li><b>บันทึก</b> = เขียนทับไฟล์เดิม (Chrome/Edge) · เบราว์เซอร์อื่นจะดาวน์โหลดไฟล์ใหม่ทุกครั้ง · <b>บันทึกเป็นไฟล์ใหม่</b> = แยกไฟล์ เช่น สำรองรายเดือน · กด Ctrl+S ได้</li>
<li>ระบบ<b>สำรองอัตโนมัติในเครื่อง</b>ทุกครั้งที่มีการเปลี่ยนแปลง (เข้ารหัสเช่นกัน) ถ้าปิดเบราว์เซอร์โดยไม่ได้บันทึก เปิดใหม่ข้อมูลยังอยู่ แต่ควรบันทึกลงไฟล์ทุกวัน</li>
<li><b>เปิดไฟล์</b> แล้วระบบใช้งานต่อในชื่อผู้ใช้คนล่าสุด (ถ้าไม่มีในไฟล์ จะใช้ผู้ดูแลระบบ) — สลับผู้ใช้ได้ที่มุมขวาบน</li></ul>
<h3>3. งานประจำวันตามกระบวนการ</h3><ol>
<li><b>ทะเบียนสวน</b> → <b>บันทึกการเก็บเกี่ยว</b> (ได้รหัส H…)</li>
<li><b>ตรวจรับมะพร้าว</b>: เลือกการเก็บเกี่ยว ระบบสร้าง Lot ID = รหัสสวน + วันเก็บเกี่ยว + ลำดับ และตัดสินผลรับ/กัก/ไม่รับให้อัตโนมัติ</li>
<li><b>ตรวจลานพัก</b> และ <b>สารพิษตกค้าง</b> ตามแผน</li>
<li><b>ป้อนวัตถุดิบเข้าผลิต</b>: เลือก lot + จำนวน ระบบแสดงเฉพาะ lot ที่ใช้ได้ (ไม่ถูกกัก ไม่หมด) เรียงตามอายุเพื่อ FIFO และบล็อกถ้าผสมชนิดหรือเกินเวลาพัก</li>
<li><b>ล้างเปลือก → กะเทาะ → กรอง</b> ผูกกับ batch</li>
<li><b>CIP ถัง</b> ก่อน แล้วจึง <b>เติมถังพัก</b> (ระบบบล็อกถ้าถังยังไม่ผ่าน CIP, ถังยังมีน้ำ, ผสมน้ำหอมกับน้ำทั่วไป หรือผิดกฎการเติมถัง เช่น 1 ถัง = 1 batch)</li><li><b>เก็บตัวอย่าง</b> ของทุกถังก่อนปล่อยสินค้า</li>
<li><b>อุณหภูมิถัง</b> ตามความถี่ที่ตั้งไว้ (ค่าเริ่มต้นทุก 2 ชั่วโมง)</li>
<li><b>ผลแล็บ</b> ของถัง → <b>ตรวจปล่อยสินค้า</b> (ระบบตรวจเวลา อุณหภูมิ NC ผลแล็บ และบันทึกที่ยังไม่ทวนสอบให้อัตโนมัติ) → พิมพ์ COA จีน/อังกฤษ</li>
<li><b>ส่งออก (Cold chain)</b> → <b>บัญชีการขาย</b></li>
<li>FSO บันทึก <b>日管控</b> ทุกวัน, <b>周排查</b> ทุกสัปดาห์, Director บันทึก <b>月调度</b> ทุกเดือน</li></ol>
<h3>4. ระบบอัตโนมัติที่ทำให้</h3><ul>
<li>สร้างรหัสทุกชนิด: Lot, Batch, Tank fill, RL, DL, NC, CAPA, เครื่องมือ, เอกสาร</li>
<li>คำนวณ: ยอดรวม, อายุการพัก, ต่าง Brix, วันหมดอายุ/ครบสอบเทียบ/ครบ PM, วันเก็บตัวอย่าง, คะแนนซัพพลายเออร์และสถานะอนุมัติ, คงเหลือสารเคมี</li>
<li>ผิดเกณฑ์ (OOS): ช่องเป็นสีแดงทันที ต้องกรอกการแก้ไขทันที แล้วระบบ<b>สร้าง NC และกักสินค้า</b> (lot/batch/ถัง) หรือสร้าง CAPA ถ้าไม่เกี่ยวกับตัวสินค้า</li>
<li>ผลแล็บของ lot → อัปเดตผลจุลินทรีย์ในบันทึกตรวจรับ</li>
<li>เอกสารเวอร์ชันใหม่ได้รับอนุมัติ → เวอร์ชันเก่าเป็น Obsolete</li>
<li>ข้อร้องเรียน / ตรวจ GMP ไม่ผ่าน → สร้าง CAPA</li>
<li>แจ้งเตือน: หมดอายุ 30/60/90 วัน, เวลาพักมะพร้าว/ถัง, ขาดบันทึกอุณหภูมิ, NC เปิด, CAPA เลยกำหนด, OOS รอทวนสอบ, FSO รายวัน, แผนอบรมเลยกำหนด</li></ul>
<h3>5. ลายมือชื่ออิเล็กทรอนิกส์และการแก้ไข</h3><ul>
<li>ลงนามด้วย PIN มี 3 ความหมาย: ผู้บันทึก → ผู้ทวนสอบ → ผู้อนุมัติ · ผู้บันทึกทวนสอบของตนเองไม่ได้</li>
<li>สิทธิ์ทวนสอบ: Director, FSO, QA, หัวหน้ากะ, QC · สิทธิ์อนุมัติ: Director, QA</li>
<li>แก้ไขบันทึกต้องใส่เหตุผลทุกครั้ง ถ้าแก้หลังทวนสอบ/อนุมัติ ลายเซ็นนั้นจะถูกล้างและต้องลงนามใหม่</li>
<li>ไม่มีการลบจริง มีแต่ "ยกเลิกบันทึก" พร้อมเหตุผลและ PIN และยกเลิกไม่ได้ถ้ามีบันทึกอื่นอ้างถึง</li>
<li>Audit trail เก็บทุกการกระทำ เชื่อมกันด้วย hash กด "ตรวจความสมบูรณ์ของ hash chain" เพื่อพิสูจน์ว่าไม่มีใครแก้ประวัติ</li></ul>
<h3>6. ความพร้อมรับการตรวจ (หน้าแรก)</h3><ul>
<li>34 ช่อง = รายการบังคับของลูกค้า D1–D15 (文件类) และ R1–R19 (记录类) คำนวณจากข้อมูลจริงในช่วงตรวจ</li>
<li>สี: เขียว ครบ · เหลือง มีช่องว่าง/ใกล้หมดอายุ · น้ำเงิน กำลังจัดทำ · แดง ขาด · แดงเข้ม หมดอายุ · เทา ไม่เกี่ยวข้อง</li>
<li>เอกสาร D: ไป <b>ทะเบียนเอกสารควบคุม</b> → "สร้างรายการเอกสารบังคับ" แล้วแก้รายละเอียด ลงนามอนุมัติทีละฉบับ</li>
<li>ข้อที่ไม่เกี่ยวข้อง (เช่น ไม่ใช้วัตถุเจือปน, ไม่มีจ้างผลิต) กดช่องนั้นแล้วระบุเหตุผล N/A</li></ul>
<h3>7. สอบกลับและ Mock recall</h3><ol>
<li>เมนู <b>สอบกลับ</b> พิมพ์รหัสใดก็ได้ (สวน, H…, lot, PB…, ถัง, RL…, DL…, เลขซีล, เลขใบแจ้งหนี้)</li>
<li>เลือก ย้อนกลับ / ไปข้างหน้า / ทั้งสองทาง ระบบแสดงห่วงโซ่ บันทึก QC ที่เกี่ยวข้องทุกขั้น (แดง = มี OOS) Mass balance และรายชื่อลูกค้า</li>
<li>ฝึก Mock recall: กด "เริ่มจับเวลา" → สอบกลับ → "หยุดจับเวลา" ระบบเปิดฟอร์มบันทึกการฝึกพร้อมเวลาและ % ติดตามได้</li></ol>
<h3>8. นำเข้า / ส่งออก Excel</h3><ul>
<li>ดาวน์โหลด<b>แม่แบบเปล่า</b> → กรอกข้อมูลเก่าในชีตที่ตรงกัน → นำเข้า ระบบจับคู่คอลัมน์ให้อัตโนมัติ</li>
<li>ไฟล์ Excel อื่นก็นำเข้าได้: เลือกชนิดบันทึกของแต่ละชีตและจับคู่คอลัมน์เอง ตรวจตัวอย่าง 5 แถวก่อนกดนำเข้า</li>
<li>วันที่รองรับ วว/ดด/ปปปป ทั้ง ค.ศ. และ พ.ศ. · ช่องอ้างอิง (เช่น lot) ใส่รหัสที่มีอยู่แล้วในระบบ · หลายรายการคั่นด้วย ; และจำนวนใช้ รหัส:จำนวน</li></ul>
<h3>9. การพิมพ์ A4 / PDF</h3><ul>
<li>ทุกบันทึกมีปุ่ม <b>พิมพ์ A4</b> และทุกรายการมี <b>พิมพ์รายการ A4</b> (แนวนอน) · หน้าแรก พิมพ์รายงานความพร้อม · สอบกลับ พิมพ์รายงาน · ปล่อยสินค้า พิมพ์ COA</li>
<li>เลือกปลายทาง "Save as PDF" ในหน้าต่างพิมพ์ ตั้งขนาด A4 และ Margins = Default · ปิด "Headers and footers" ของเบราว์เซอร์เพื่อหัวกระดาษที่สะอาด</li></ul>
<h3>10. ข้อจำกัดของเวอร์ชันนี้</h3><ul>
<li>เป็นไฟล์เดียวใช้ในเครื่อง: หลายคนใช้พร้อมกันไม่ได้ ให้ส่งต่อไฟล์ทีละคน หรือใช้เครื่องกลางเครื่องเดียวที่หน้างาน</li>
<li>Hash chain ตรวจจับการแก้ประวัติได้ แต่ป้องกันไม่ได้ 100% เพราะไฟล์อยู่ในมือผู้ใช้ — เวอร์ชันฐานข้อมูลกลาง (Supabase) จะปิดจุดนี้</li>
<li>ยังไม่แนบไฟล์ PDF/รูปในระบบ ให้ใส่ลิงก์ที่เก็บไฟล์ไว้ในช่อง "ที่เก็บไฟล์ / ลิงก์" หรือหมายเหตุ</li>
<li>ข้อความที่ผู้ใช้พิมพ์เอง (ชื่อ หมายเหตุ ฯลฯ) แสดงตามที่พิมพ์ ไม่แปลอัตโนมัติ</li></ul>
<h3>11. เชื่อมต่อ Cloud (Supabase)</h3><ol>
<li><b>ครั้งเดียว (ผู้ดูแล):</b> Supabase → SQL Editor → วาง SQL จากปุ่ม "ดู SQL สำหรับตั้งค่า Supabase" แล้วกด Run</li>
<li>Project Settings → API (Data API) → Exposed schemas → เพิ่ม <code>fsms</code> แล้วกด Save</li>
<li>Authentication → Users → Add user สร้างบัญชีของโรงงาน (เช่น อีเมลกลางของ QA) เลือก Auto confirm แล้วรันคำสั่งข้อ 6 ใน SQL เพื่อเพิ่มบัญชีนี้ใน fsms.members</li>
<li><b>เครื่องหลัก (มีข้อมูลอยู่แล้ว):</b> ☁ เชื่อมต่อ Cloud → ใส่อีเมล/รหัสผ่านบัญชีข้อ 3 → ระบบถามให้อัปโหลดข้อมูลตั้งต้น → ตกลง</li>
<li><b>เครื่องอื่น:</b> เปิดไฟล์ HTML เดียวกัน → กดปุ่ม ☁ เชื่อมต่อ Cloud ที่แถบบน → ใส่อีเมล/รหัสผ่านเดียวกัน → เลือก "ใช้ข้อมูลจาก Cloud" → กดชื่อมุมขวาบนเพื่อสลับเป็นผู้ใช้ของตัวเอง (ใส่ PIN)</li>
<li>บัญชี Supabase ใช้แค่เปิดประตูเข้าข้อมูลของเครื่อง ส่วนลายเซ็นและสิทธิ์ยังใช้ผู้ใช้/PIN ของแต่ละคนในระบบเหมือนเดิม</li>
<li>ปุ่ม "บันทึก" ไฟล์ยังใช้ได้ แนะนำบันทึกไฟล์สำรองสัปดาห์ละครั้ง · ถ้าเปิดไฟล์ขณะต่อ Cloud ระบบจะถามว่าจะส่งข้อมูลจากไฟล์ขึ้นไปแทนหรือกลับไปใช้ข้อมูล Cloud</li></ol>

/* ---- HTTP (Supabase REST + Auth, no library) ---- */
async function clFetch(path,opt={},auth=true){if(auth)await clEnsureToken();
  const h=Object.assign({apikey:CL.key,'Content-Type':'application/json'},opt.headers||{});
  if(auth&&CL.sess)h.Authorization='Bearer '+CL.sess.access;
  let res;try{res=await fetch(CL.url.replace(/\/+$/,'')+path,Object.assign({},opt,{headers:h}))}catch(e){const er=new Error('เชื่อมต่ออินเทอร์เน็ต/Supabase ไม่ได้');er.offline=true;throw er}
  const txt=await res.text();let body=null;try{body=txt?JSON.parse(txt):null}catch(e){body=txt}
  if(!res.ok){let m=(body&&(body.msg||body.message||body.error_description||body.error))||('HTTP '+res.status);
    if(/schema must be one of|Invalid schema/i.test(m))m='ยังไม่ได้เพิ่ม schema "'+CL.schema+'" ใน Exposed schemas (Settings → API) — '+m;
    if(/row-level security/i.test(m))m='ไม่มีสิทธิ์ (RLS): บัญชีนี้ยังไม่อยู่ใน fsms.members — '+m;
    if(/Invalid login credentials/i.test(m))m='อีเมลหรือรหัสผ่าน Supabase ไม่ถูกต้อง';
    const e=new Error(m);e.status=res.status;throw e}
  return body}
function setSess(b){CL.sess={access:b.access_token,refresh:b.refresh_token,exp:Date.now()+((b.expires_in||3600)*1000),uid:b.user&&b.user.id};saveCloudCfg()}

const clProf=m=>m==='GET'?{'Accept-Profile':CL.schema}:{'Content-Profile':CL.schema,'Accept-Profile':CL.schema};

async function clGet(){const r=await clFetch(clQ()+'&select=*',{method:'GET',headers:clProf('GET')});return (r&&r[0])||null}

  body:JSON.stringify({id:CL.stateId,data,version:1,app_ver:APP.ver,updated_by:who()})});return (r&&r[0])||null}
async function clUpdate(data,ver,force){const r=await clFetch(clQ()+(force?'':'&version=eq.'+ver),{method:'PATCH',headers:Object.assign(clProf('PATCH'),{Prefer:'return=representation'}),

/* ---- merge ---- */
async function mergeDB(R,Lc,dirty,dirtyMeta,baseAuditLen){
  const out=R;const codeClash=[];
  for(const t of ORDER){const ra=out.rec[t]||(out.rec[t]=[]);const la=(Lc.rec&&Lc.rec[t])||[];const idx=new Map(ra.map((r,i)=>[r._id,i]));
    for(const r of la){const k=t+':'+r._id;if(!dirty[k])continue;const i=idx.get(r._id);if(i==null){ra.push(r);idx.set(r._id,ra.length-1)}else ra[i]=r}
    const o=T[t];const f=o.idf&&o.fmap[o.idf];
    if(f&&f.t==='id'&&f.gen){const seen=new Map();ra.forEach(r=>{if(!r[o.idf])return;const c=r[o.idf];if(seen.has(c)&&seen.get(c)!==r._id){const loser=dirty[t+':'+r._id]?r:ra.find(x=>x._id===seen.get(c));if(loser&&dirty[t+':'+loser._id]){codeClash.push([t,loser,c])}}else seen.set(c,r._id)})}}
  if(dirtyMeta){out.settings=Lc.settings;const m=new Map(out.users.map(u=>[u.id,u]));Lc.users.forEach(u=>m.set(u.id,u));out.users=[...m.values()]}
  else{const ids=new Set(out.users.map(u=>u.id));Lc.users.forEach(u=>{if(!ids.has(u.id))out.users.push(u)})}
  const add=(Lc.audit||[]).slice(baseAuditLen||0);let prev=out.audit.length?out.audit[out.audit.length-1].hash:'GENESIS';
  for(const e0 of add){const e=Object.assign({},e0);e.seq=out.audit.length+1;e.prev=prev;e.hash=await sha(auditPayload(e));out.audit.push(e);prev=e.hash}
  out.meta=Object.assign({},out.meta,{saved:stamp(),ver:APP.ver});
  return {db:out,codeClash}}
function fixCodeClash(list){list.forEach(([t,r,c])=>{const o=T[t];const old=JSON.parse(JSON.stringify(r));r[o.idf]='';genIds(t,r);
  logAuto(t,r,'เปลี่ยนรหัสอัตโนมัติ: รหัส '+c+' ซ้ำกับที่อีกเครื่องบันทึกพร้อมกัน → '+r[o.idf],old);
  setTimeout(()=>toast('รหัส '+c+' ซ้ำกับอีกเครื่อง เปลี่ยนเป็น '+r[o.idf]+' แล้ว — ตรวจป้ายที่พิมพ์ไปแล้ว','bad'),300)})}

/* ---- sync engine ---- */
let clBusy=false,clTimer=null;
function setCl(st,msg){clStatus={st,msg:msg||''};if(ME)renderTop()}
function cloudSchedule(){if(!CL.on)return;clearTimeout(clTimer);clTimer=setTimeout(()=>cloudSync(),2500)}
function applyRemote(rdb,row){const uid=ME&&ME.id;DB=migrate(rdb);CL.baseVersion=row.version;CL.baseAuditLen=DB.audit.length;CL.dirty={};CL.dirtyMeta=false;
  CL.head={version:row.version,updated_at:row.updated_at,updated_by:row.updated_by};CL.lastSync=stamp();saveCloudCfg();
  try{localStorage.setItem(LSKEY,'')}catch(e){}autoSave();
  if(uid){ME=DB.users.find(u=>u.id===uid)||null;if(!ME){ME=null;showLogin();return}if(!UI.form)render();toast(L2('อัปเดตข้อมูลล่าสุดจาก Cloud','已从云端更新最新数据')+(row.updated_by?' ('+row.updated_by+')':''),'ok')}
  else showLogin()}
function afterPush(row,snapGen,snapAudit){CL.baseVersion=row.version;CL.baseAuditLen=snapAudit;
  Object.keys(CL.dirty).forEach(k=>{if(CL.dirty[k]<=snapGen)delete CL.dirty[k]});CL.dirtyMeta=false;
  CL.head={version:row.version,updated_at:row.updated_at,updated_by:row.updated_by};CL.lastSync=stamp();saveCloudCfg()}
async function pushNow(ver,force){await auditQ;const snapGen=CLGEN,snapAudit=DB.audit.length;const enc=await encryptObj(DB);
  const row=ver==null&&!force?await clInsert(enc):await clUpdate(enc,ver,force);if(row)afterPush(row,snapGen,snapAudit);return row}
async function cloudSync(opt={}){if(!CL.on||!CL.sess)return;if(clBusy){cloudSchedule();return}clBusy=true;setCl('sync');
  try{await auditQ;for(let tries=0;tries<4;tries++){
      const head=await clHead();
      if(!head){if(opt.allowInit){await pushNow(null);break}setCl('empty');return}
      if(head.version!==CL.baseVersion){const row=await clGet();const rdb=migrate(await decryptText(row.data));
        if(clPending()&&CL.baseVersion!=null||opt.mergeAll){await auditQ;const {db,codeClash}=await mergeDB(rdb,DB,CL.dirty,CL.dirtyMeta,opt.mergeAll?0:CL.baseAuditLen);
          const uid=ME&&ME.id;DB=db;if(uid)ME=DB.users.find(u=>u.id===uid)||ME;if(codeClash.length)fixCodeClash(codeClash);await auditQ;
          opt.mergeAll=false;const r=await pushNow(row.version);if(!r)continue;if(ME&&!UI.form)render();break}
        applyRemote(rdb,row);break}
      if(clPending()){const r=await pushNow(CL.baseVersion);if(!r)continue}
      CL.head=head;CL.lastSync=stamp();saveCloudCfg();break}
    setCl('ok')}
  catch(e){setCl(e.offline?'offline':'err',e.message);if(opt.throwErr)throw e}
  finally{clBusy=false}}
setInterval(()=>{if(CL.on&&CL.sess&&!document.hidden)cloudSync()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CL.on&&CL.sess)cloudSync()});
window.addEventListener('online',()=>{if(CL.on)cloudSync()});

function cloudModal(){const can=!ME||CAN.settings.includes(ME.role);const dis=can?'':'disabled';
